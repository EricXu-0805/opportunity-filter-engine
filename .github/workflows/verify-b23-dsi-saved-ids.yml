name: Save and reopen both DSI Summer Lab originals on the published site
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/verify-b23-dsi-saved-ids.yml', 'scripts/verify_dsi_saved_originals.py']
permissions:
  contents: read
jobs:
  saved:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      OFE_EXPECTED_SITE_SHA: e4edf82957625f9573a7af276d3951caa1d54fb5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet playwright==1.55.0
      - run: python -u scripts/verify_dsi_saved_originals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsi-own-guest-saved-originals
          path: ${{ runner.temp }}/dsi-saved-originals.json
