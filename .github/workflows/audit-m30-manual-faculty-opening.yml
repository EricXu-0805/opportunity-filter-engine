name: Read free hand-edited faculty opening claims
on:
  push:
    branches: [audit/m30-free-faculty-opening-20261127]
    paths: ['scripts/verify_m30_manual_faculty_opening.py','.github/workflows/audit-m30-manual-faculty-opening.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OFE_EXPECTED_SITE_SHA: observed-from-public-start-and-end
      M30_RESULT: /tmp/m30-free-opening.json
      M30_MODE: before
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet playwright==1.55.0
      - run: python scripts/verify_m30_manual_faculty_opening.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m30-free-opening
          path: /tmp/m30-free-opening.json
