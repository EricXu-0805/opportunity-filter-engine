name: Check free manual drafts on the isolated faculty and advertised listing
on:
  push:
    branches: [audit/m30-free-faculty-opening-20261127]
    paths:
      - '.github/workflows/audit-m30-manual-faculty-opening.yml'
      - 'scripts/verify_m30_manual_faculty_opening.py'
permissions:
  contents: read
jobs:
  details:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE: f4a36c66061c4a021c15a1bfcc9aa3f96f2ea45e
      BACKEND_URL: http://127.0.0.1:8100
      OFE_RELEASE_SHA: f4a36c66061c4a021c15a1bfcc9aa3f96f2ea45e
      OFE_ENVIRONMENT: isolated-candidate
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v6
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: f4a36c66061c4a021c15a1bfcc9aa3f96f2ea45e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: candidate/frontend/package-lock.json
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.95.4
      - name: Start the isolated account and profile database from the candidate migrations
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/m30faculty"
          mkdir -p "$fixture"
          cd "$fixture"
          supabase init
          mkdir -p supabase/migrations
          source_sql="$GITHUB_WORKSPACE/candidate/supabase/migrations"
          for file in "$source_sql"/*.sql; do
            if [[ "$(basename "$file")" != 20261125130000_guard_tracker_attachment_replacement.sql ]]; then
              cp "$file" supabase/migrations/
            fi
          done
          sed -i 's/^enable_anonymous_sign_ins = false/enable_anonymous_sign_ins = true/' supabase/config.toml
          supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >"$fixture/start.log" 2>&1
          docker exec -i supabase_db_m30faculty sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql -h 127.0.0.1 -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres' < "$source_sql/20261125130000_guard_tracker_attachment_replacement.sql"
          umask 077
          supabase status -o json >"$fixture/status.json"
          jq -r '"NEXT_PUBLIC_SUPABASE_ANON_KEY=" + .ANON_KEY, "SUPABASE_SERVICE_ROLE_KEY=" + .SERVICE_ROLE_KEY, "SUPABASE_URL=" + .API_URL' "$fixture/status.json" >> "$GITHUB_ENV"
      - name: Install normal runtime and verify the hosted Chrome available to Playwright
        run: |
          python -m pip install -q -r candidate/requirements.txt playwright==1.55.0
          google-chrome --version
          npm ci --prefix candidate/frontend --no-audit --no-fund
      - name: Build the exact candidate and assemble its full corpus
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          python scripts/shard_corpus.py assemble --force
          npm --prefix frontend run build
      - name: Check the original detail routes against the normal services
        working-directory: candidate
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8100 >"$RUNNER_TEMP/ofe-api.log" 2>&1 &
          npm --prefix frontend run start -- --hostname 127.0.0.1 --port 3000 >"$RUNNER_TEMP/ofe-next.log" 2>&1 &
          for attempt in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:3000/api/health >"$RUNNER_TEMP/ofe-health.json"; then break; fi
            sleep 2
          done
          M30_EXPECTED_SHA="$CANDIDATE" M30_LOCAL_SITE=http://127.0.0.1:3000 OFE_EXPECTED_SITE_SHA="$CANDIDATE" M30_MODE=after M30_RESULT="$GITHUB_WORKSPACE/m30-free-opening.json" python ../audit/scripts/verify_m30_manual_faculty_opening.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m30-candidate-free-opening
          path: m30-free-opening.json
          if-no-files-found: warn
