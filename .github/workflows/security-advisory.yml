name: Security advisory

# Advisory only — deliberately NOT one of the required checks (required:
# Backend, Frontend, Migrations, E2E). Dependency audits are driven by upstream
# advisory publication, not by this diff: a CVE disclosed against a transitive
# dep at 3am must not block an unrelated release, and pinning the audit to
# "warn" inside a required job was the dishonest alternative (a
# `continue-on-error` step reads as a gate in the checks list while being
# incapable of failing anything).
#
# So: these steps DO fail — this job goes red and is visible on the PR — and
# merging is a human decision rather than a silently-swallowed warning. If an
# audit finding ever must block, move that step into a required job WITHOUT
# continue-on-error; do not re-add an ignored-failure step to one.
#
# WHY THIS LIVES OUTSIDE ci.yml, on pull_request only:
# Render deploys the backend with `autoDeployTrigger: checksPass`, which waits
# for EVERY check run on the commit and counts only success/neutral/skipped as
# passing — it does not know which checks branch protection marks required. So
# while this job ran on push-to-main, one red advisory made the whole CI run
# red and Render silently stopped deploying. That is exactly what happened:
# da18e7b (#733) introduced this job, three cryptography advisories turned it
# red, and the backend froze on the previous commit for four days while Vercel
# (which does not wait for checks) shipped the new frontend — a front/back
# split-brain nobody was told about.
#
# On pull_request the audit still runs on every change, because every change
# reaches main through a PR (including the daily data-refresh PR, so newly
# disclosed advisories against unchanged pins surface within a day). The
# squash-merge commit on main carries no advisory check run, so a red audit
# can never again stop a deploy.
#
# Deliberately no `schedule:` trigger: a scheduled run attaches its check to
# the newest commit on the default branch, which would reintroduce the exact
# failure mode this file exists to remove.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-advisory-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-advisory:
    name: Security advisory (non-blocking)
    runs-on: ubuntu-latest
    # Runs pip install + pip-audit, then a full `npm ci` before `npm audit`.
    # That crossed 10 minutes and the job was killed mid-`npm audit`, which
    # shows up as a red check — and "non-blocking" is about branch protection,
    # not about Render, whose checksPass gate does not distinguish required
    # from optional. A timeout here silently holds up the backend deploy.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Dependency audit (pip-audit)
        # The --ignore-vuln exception is carried over verbatim from the commit
        # that introduced this audit (19327a7, "add ruff lint + dependency
        # audit gates"), which recorded no rationale for it anywhere in the
        # repo. It is preserved rather than re-litigated because this change is
        # about WHERE the audit runs, not which findings are accepted — but it
        # is an undocumented exception, so the next person to touch it should
        # confirm the advisory still applies and write down why it is accepted.
        run: pip-audit --requirement requirements.txt --strict --ignore-vuln GHSA-4xh5-x5gv-qwph

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        # `npm audit` resolves against the installed tree; --ignore-scripts
        # keeps an audit job from running package lifecycle scripts.
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
