name: Read the School of Education faculty classification
on:
  push:
    branches: [audit/pitt-duke-affiliates-20261126]
    paths: [data/audits/observed-faculty-2026-11-26/pitt-linguistics-monthly/read_education_rosters.py]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: data/audits/observed-faculty-2026-11-26/pitt-linguistics-monthly
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python data/audits/observed-faculty-2026-11-26/pitt-linguistics-monthly/read_education_rosters.py
      - uses: actions/upload-artifact@v4
        with:
          name: pitt-education-faculty
          path: education-faculty.json
          retention-days: 30
