name: Verify public M04 match card and free draft
on:
  push:
    branches: [codex/diagnose-nov25-roster-sources]
    paths:
      - data/audits/verify_m04_public_card_20261126.py
permissions:
  contents: read
jobs:
  visitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: data/audits
      - run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - run: python -u data/audits/verify_m04_public_card_20261126.py
        env:
          M04_CASE: berkeley
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-match-card-and-unsent-draft
          path: evidence/
          if-no-files-found: ignore
          retention-days: 30
