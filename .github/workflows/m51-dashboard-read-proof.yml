name: Reproduce and verify Dashboard read recovery
on:
  push:
    branches: [codex/diagnose-m51-dashboard-read]
    paths: ['.github/workflows/m51-dashboard-read-proof.yml','frontend/m51-isolated.config.ts','frontend/e2e/m51-baseline.spec.ts']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked frontend and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/browser-install.log" 2>&1
      - name: Observe the reported zero on the previous source with an injected 503
        run: |
          git restore --source cb681c12ed5d3c12fde3e7f4f80c9c01dd68b2f6 -- frontend/src
          cd frontend
          npx playwright test --config=m51-isolated.config.ts e2e/m51-baseline.spec.ts
      - name: Verify both pages recover on the candidate with the same synthetic failure
        run: |
          git restore --source e2451123f3644e47da560eb644a463a3fbd3c5e9 -- frontend/src
          cd frontend
          npx playwright test --config=m51-isolated.config.ts e2e/dashboard.spec.ts --grep 'a favorites read outage'
