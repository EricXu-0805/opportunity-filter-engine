name: Verify school freshness in the production picker and results
on:
  push:
    branches: [codex/diagnose-nov25-roster-sources]
    paths:
      - 'data/audits/pending-public-20261126/check_school_freshness.py'
      - '.github/workflows/verify-public-school-freshness.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: data/audits/pending-public-20261126
      - run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - run: python -u data/audits/pending-public-20261126/check_school_freshness.py
      - uses: actions/upload-artifact@v4
        with:
          name: School-freshness
          path: school-evidence
          if-no-files-found: error
          retention-days: 30
