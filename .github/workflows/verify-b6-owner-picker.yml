name: Check the sixth candidate work-history picker through real browser owner changes
on:
  push:
    branches: [codex/diagnose-nov25-roster-sources]
    paths: [data/audits/verify_b6_owner_picker_20261126.py]
permissions:
  contents: read
jobs:
  owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BACKEND_URL: http://127.0.0.1:8100
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-loopback-stub-anon-key-not-a-real-key
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: data/audits
      - uses: actions/checkout@v6
        with:
          path: product
          ref: fb62e520a2bc0e48813c18680f5c27dd57b891a6
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: product/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json
      - run: pip install -r product/requirements.txt
      - run: npm ci
        working-directory: product/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: product/frontend
      - run: python data/audits/verify_b6_owner_picker_20261126.py
      - run: npm run build
        working-directory: product/frontend
      - run: npx playwright test --project=chromium --reporter=line --retries=0 e2e/profile-freshness.spec.ts e2e/cloud-save-scenarios.spec.ts --grep 'a second Home tab completes its real profile read|a guest who opens the sign-in link in a new tab keeps the account profile'
        working-directory: product/frontend
