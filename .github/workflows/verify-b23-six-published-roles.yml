name: Read six published saved roles at Pittsburgh, Rutgers and Michigan State
on:
  push:
    branches: [audit/b20-original-details-20261126]
    paths: ['.github/workflows/verify-b23-six-published-roles.yml']
permissions:
  contents: read
jobs:
  original-roles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: two-campus-jia
            program: data/audits/maintenance-2026-11-26/check_pitt_rutgers_appointment.py
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Open saved public roles through the normal student site
        env:
          OFE_SHA: e4edf82957625f9573a7af276d3951caa1d54fb5
        run: |
          python "${{ matrix.program }}" --site https://joinalab.com --sha "$OFE_SHA" --scope mvp-core-close-v1-contact-trust-v1-faculty-trust-v1-target-truth-v2 --out published-roles.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: b23-published-${{ matrix.name }}
          path: published-roles.json
          if-no-files-found: warn
