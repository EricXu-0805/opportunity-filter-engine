name: M48 isolated Chromium diagnostic
on:
  push:
    branches: [diagnose/m48-worker-in-ci-20261126]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: frontend
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c m48-fixture.config.ts --repeat-each 3
