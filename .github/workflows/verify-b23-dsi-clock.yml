name: Read both saved Summer Lab pages on the verified B23 candidate
on:
  push:
    branches: [audit/b20-original-details-20261126]
    paths:
      - '.github/workflows/verify-b23-dsi-clock.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OFE_RELEASE_SHA: 72a8b0027b314903c0228fcaa536769e9b7fe91e
      OFE_ENVIRONMENT: isolated-candidate
      NEXT_TELEMETRY_DISABLED: '1'
      BACKEND_URL: http://127.0.0.1:39784
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-candidate-no-account-service
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c7b5552cf0def0512c9d37854380f1ec875fa9a3
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: candidate
          ref: 72a8b0027b314903c0228fcaa536769e9b7fe91e
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: candidate/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - name: Build the candidate using its dependencies and complete corpus
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$OFE_RELEASE_SHA"
          python -m pip install -q -r requirements.txt
          npm ci --prefix frontend --no-audit --no-fund
          (cd frontend && npx playwright install --with-deps chromium > "$RUNNER_TEMP/dsi-chromium-install.log")
          python scripts/shard_corpus.py assemble --force
          npm --prefix frontend run build
      - name: Check real Chromium pages and backend responses before, at and after closing
        working-directory: candidate
        run: |
          checks="$GITHUB_WORKSPACE/audit/data/audits/dsi-summerlab-2026-11-26"
          export DSI_TEST_CLOCK="$RUNNER_TEMP/dsi-simulated-clock.txt"
          PYTHONPATH=. python "$checks/serve-backend.py" > "$RUNNER_TEMP/dsi-api.log" 2>&1 &
          npm --prefix frontend run start -- --hostname 127.0.0.1 --port 39785 > "$RUNNER_TEMP/dsi-next.log" 2>&1 &
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:39785/api/opportunities/uchicago-8cd2def060b6 > /dev/null; then break; fi
            sleep 2
          done
          node "$checks/check-rendered-dsi.cjs" http://127.0.0.1:39785 "$OFE_RELEASE_SHA" "$RUNNER_TEMP/dsi-browser.json" "$DSI_TEST_CLOCK"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: b23-dsi-candidate-browser
          path: |
            ${{ runner.temp }}/dsi-browser.json
            ${{ runner.temp }}/dsi-api.log
            ${{ runner.temp }}/dsi-next.log
