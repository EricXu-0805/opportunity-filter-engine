name: Read the six B20 published faculty details in Chromium
on:
  push:
    branches: [audit/b20-original-details-20261126]
    paths:
      - '.github/workflows/verify-b20-six-production-saved-originals.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the browser client
        run: |
          python -m pip install -q requests playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Open the six saved public details and their normal public data
        run: python data/audits/maintenance-2026-11-26/check_b20_published_faculty.py --site https://joinalab.com --sha f30443aa8654bd1c0d093ccd6fd9c067c3f4148a --scope mvp-core-close-v1-contact-trust-v1-faculty-trust-v1-target-truth-v2 --include-ucf --out b20-six-public-details.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: b20-six-published-faculty
          path: b20-six-public-details.json
          if-no-files-found: warn
