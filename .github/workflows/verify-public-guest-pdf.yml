name: Verify a synthetic anonymous resume through the official site
on:
  push:
    branches: [codex/verify-m11-coursework]
    paths: ['.github/workflows/verify-public-guest-pdf.yml', 'data/audits/m11-coursework/**']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            data/audits/m11-coursework
            frontend/src/lib/__fixtures__/resume-pdf
      - run: python -m pip install --quiet playwright==1.55.0
      - run: python -u data/audits/m11-coursework/unreadable.py
      - uses: actions/upload-artifact@v4
        with:
          name: M11-coursework
          path: m11-results
          if-no-files-found: error
