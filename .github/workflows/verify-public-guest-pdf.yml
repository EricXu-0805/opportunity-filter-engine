name: Verify a synthetic anonymous resume through the official site
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/verify-public-guest-pdf.yml', 'scripts/verify_public_guest_pdf_390.py']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --quiet playwright==1.55.0
      - run: python -u scripts/verify_public_guest_pdf_390.py --independent-github-skill --verify-match-input
