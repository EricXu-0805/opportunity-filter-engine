name: Read both published Pitt CS faculty lists
on:
  push:
    branches: [audit/pitt-duke-affiliates-20261126]
    paths: [data/audits/observed-faculty-2026-11-26/pitt-computer-science/read_published_lists.py]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: data/audits/observed-faculty-2026-11-26/pitt-computer-science
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python data/audits/observed-faculty-2026-11-26/pitt-computer-science/read_published_lists.py
      - uses: actions/upload-artifact@v4
        with:
          name: pitt-cs-published-lists
          path: pitt-cs-public-lists.json
          retention-days: 30
