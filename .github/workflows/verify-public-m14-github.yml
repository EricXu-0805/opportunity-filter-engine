name: Verify public GitHub experience import
on:
  push:
    branches: [codex/diagnose-nov25-roster-sources]
    paths:
      - data/audits/m14-production-verify.json
permissions:
  contents: read
jobs:
  visitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: data/audits
      - run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - run: python -u data/audits/verify_m14_public_github_20261126.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-github-experience
          path: evidence/
          if-no-files-found: ignore
          retention-days: 30
