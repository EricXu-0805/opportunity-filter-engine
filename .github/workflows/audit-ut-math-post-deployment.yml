name: Read deployed UT and Columbia mathematics appointments
on:
  push:
    branches: ['audit/ut-math-b30-public-*']
permissions:
  contents: read
jobs:
  deployed:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests beautifulsoup4 playwright==1.55.0
      - name: Read the declared release and verify all three ordinary guest actions
        shell: bash
        run: |
          set -euo pipefail
          wanted="${GITHUB_REF_NAME#audit/ut-math-b30-public-}"
          [[ "$wanted" =~ ^[0-9a-f]{40}$ ]]
          UT_EXPECT_RELEASE="$wanted" UT_MATH_RECEIPT=/tmp/ut-math-originals.json python scripts/verify_ut_math_original_appointments.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ut-math-deployed-originals
          path: /tmp/ut-math-originals.json
          if-no-files-found: warn
