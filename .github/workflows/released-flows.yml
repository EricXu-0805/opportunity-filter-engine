name: Verify released opportunity and profile flows
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/released-flows.yml','scripts/verify_live_browser_flows.py','scripts/verify_live_public_flows.py','scripts/verify_isolated_request_lane.py']
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - run: python -u scripts/verify_live_public_flows.py
  browser:
    strategy:
      fail-fast: false
      matrix:
        flow: [erroren, errorzh]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -u scripts/verify_live_browser_flows.py ${{ matrix.flow }}
  release-error-variants:
    name: Published frontend error messages in both languages, including reference ID
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1b57b7ddd509f1adc1b8fdf2299dd8ff7eaeaef2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test -- --reporter=verbose src/app/error.test.tsx src/app/not-found.test.tsx
        working-directory: frontend
