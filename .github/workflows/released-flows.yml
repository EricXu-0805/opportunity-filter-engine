name: Verify released opportunity and profile flows
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/released-flows.yml', 'scripts/verify_public_outreach_paths.py']
permissions:
  contents: read
jobs:
  outreach:
    name: Public match, actions and unsent template (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        target: [profile, inquiry, listing]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -u scripts/verify_public_outreach_paths.py ${{ matrix.target }}
