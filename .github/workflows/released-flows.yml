name: Verify released opportunity and profile flows
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/released-flows.yml', 'scripts/verify_public_outreach_paths.py', 'scripts/verify_live_browser_flows.py']
permissions:
  contents: read
jobs:
  outreach:
    if: "!startsWith(github.event.head_commit.message, 'Verify M48 saved reminder') && !startsWith(github.event.head_commit.message, 'Verify M51 large lists') && !startsWith(github.event.head_commit.message, 'Verify M23 released match') && !startsWith(github.event.head_commit.message, 'Verify M48 released subscription') && !startsWith(github.event.head_commit.message, 'Verify M25 released export') && !startsWith(github.event.head_commit.message, 'Verify M67 profile change review') && !startsWith(github.event.head_commit.message, 'Verify M25 released pay') && !startsWith(github.event.head_commit.message, 'Verify M23 listing eligibility')"
    name: Public match, actions and unsent template (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        target: [profile, inquiry, listing]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -u scripts/verify_public_outreach_paths.py ${{ matrix.target }}
  school-freshness:
    name: Published November 25 freshness for all 115 schools
    if: startsWith(github.event.head_commit.message, 'Verify M204 production snapshot')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Compare public status and success times to the published report projection
        shell: python
        run: |
          import hashlib
          import json
          import time
          from urllib.request import urlopen

          def read(path):
              url = "https://joinalab.com/api/" + path + "?snapshot=" + str(time.time_ns())
              with urlopen(url, timeout=30) as response:
                  return json.load(response)

          def digest(value):
              canonical = json.dumps(value, sort_keys=True, separators=(",", ":")).encode()
              return hashlib.sha256(canonical).hexdigest()

          release = read("health")["release_sha"]
          schools = read("opportunities/freshness")["schools"]
          assert read("health")["release_sha"] == release, "Release changed during the read"
          print("Render release:", release)
          dates = {school: value["last_checked_at"] for school, value in schools.items()}
          print("Schools:", len(schools), "public digest:", digest(schools), "times digest:", digest(dates))
          assert len(schools) == 115
          # Independently projected from #1275 and #1276. All success times agree.
          assert digest(dates) == "7bea5dba39be0f59574e4fe7adc841769b46446fd2f0702786e021d4b0f2152a"
          assert digest(schools) == "0e4413838c14d7b703aff1da0528c21c08ece26c6ae780e10c7c8273984b7544"
          changed = "buffalo casewestern cmu georgetown grinnell iastate middlebury ncsu nd njit oregonstate osu uconn udel uiuc utk".split()
          for school in changed:
              print(school, schools[school])
              assert schools[school]["status"] == "partly_unchecked"
          prior = {school: dict(value) for school, value in schools.items()}
          for school in changed:
              prior[school]["status"] = "current"
          assert digest(prior) == "08749d3ad410ed8c4936fc48136719299d18ce88977149d9e109292a0d8a2558"

  large-accounts:
    name: Released Dashboard / 1001 historical rows (${{ matrix.table }})
    if: startsWith(github.event.head_commit.message, 'Verify M51 large lists')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        table: [tracker, favorites]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -u scripts/verify_live_browser_flows.py "large-$TARGET-$PHASE"
        env:
          TARGET: ${{ matrix.table }}
          PHASE: ${{ startsWith(github.event.head_commit.message, 'Verify M51 large lists after') && 'after' || 'before' }}

  match-evidence:
    name: Released match evidence (${{ matrix.locale }})
    if: startsWith(github.event.head_commit.message, 'Verify M23 released match')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        locale: [en, zh]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -u scripts/verify_public_outreach_paths.py "score-$PHASE-$LOCALE"
        env:
          LOCALE: ${{ matrix.locale }}
          PHASE: ${{ contains(github.event.head_commit.message, 'M59 fallback') && 'fallback' || contains(github.event.head_commit.message, 'M59 localized') && 'localized' || startsWith(github.event.head_commit.message, 'Verify M23 released match after') && 'after' || 'before' }}

  push-status:
    name: Released Dashboard notification read and retry (${{ matrix.fault }})
    if: startsWith(github.event.head_commit.message, 'Verify M48 released subscription')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        fault: ${{ fromJSON(startsWith(github.event.head_commit.message, 'Verify M48 released subscription after account switch') && '["switch"]' || contains(github.event.head_commit.message, 'registration and permission') && '["register","deny"]' || '["account","browser"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -u scripts/verify_live_browser_flows.py "push-$FAULT-$PHASE"
        env:
          FAULT: ${{ matrix.fault }}
          PHASE: ${{ startsWith(github.event.head_commit.message, 'Verify M48 released subscription after') && 'after' || 'before' }}

  export-scope:
    name: Released filtered CSV download with two stored favorites
    if: startsWith(github.event.head_commit.message, 'Verify M25 released export')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -u scripts/verify_public_outreach_paths.py "export-$PHASE"
        env:
          PHASE: ${{ startsWith(github.event.head_commit.message, 'Verify M25 released export after') && 'after' || 'before' }}

  listing-eligibility:
    name: Released listing and detail evidence
    if: startsWith(github.event.head_commit.message, 'Verify M25 released pay') || startsWith(github.event.head_commit.message, 'Verify M23 listing eligibility')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -u scripts/verify_public_outreach_paths.py "$CHECK-$PHASE"
        env:
          CHECK: ${{ startsWith(github.event.head_commit.message, 'Verify M25 released pay') && 'pay' || 'eligibility' }}
          PHASE: ${{ (startsWith(github.event.head_commit.message, 'Verify M25 released pay after') || startsWith(github.event.head_commit.message, 'Verify M23 listing eligibility after')) && 'after' || 'before' }}

  review-profile-change:
    name: Four production-build Favorites Tailor checks with retries disabled
    if: startsWith(github.event.head_commit.message, 'Verify M67 profile change review')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: af6a3efd479c1f2d445f77f68e438e4553c9d21d
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Normally <1 min; CDN downloads have stalled for hours, so fail fast.
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        # Browsers restored from cache still need the apt packages each run.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build frontend (E2E runs against a production server, not dev)
        # next dev compiles each route on first hit, which made the suite blow
        # past the job timeout. Building once + `next start` (see
        # playwright.config webServer) serves pre-compiled routes, cutting the
        # run dramatically. The Frontend job already proves `npm run build`
        # passes in CI.
        #
        # BACKEND_URL must be set at BUILD time: next.config.js rewrites are
        # baked into routes-manifest.json during `next build` and are NOT
        # re-evaluated by `next start` — without it the built app proxies
        # /api/* to the LIVE production backend instead of the local uvicorn
        # the Playwright webServer boots.
        #
        # The NEXT_PUBLIC_* pair must ALSO be baked here (values mirror
        # frontend/playwright.config.ts): the client bundle inlines them at
        # build time, and the app follows persistence rather than flipping
        # optimistically — built without a storage backend, tracker/favorites
        # are correctly inert and every persistence spec fails. `next dev`
        # injects them per-request, so only the CI production build needs this.
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-loopback-stub-anon-key-not-a-real-key

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium e2e/writing-entry-checks.spec.ts --grep "Favorites Tailor checks" --repeat-each=4 --retries=0
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: review-context
          path: frontend/test-results/**/error-context.md
          retention-days: 7

  saved-reminder:
    if: startsWith(github.event.head_commit.message, 'Verify M48 saved reminder')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright test --config=playwright.released-reminder.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: isolated-reminder-receipt
          path: frontend/test-results/**/error-context.md
