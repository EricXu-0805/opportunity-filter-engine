name: Capture the fictional student walkthrough
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/capture-u31-demo.yml', 'scripts/capture_u31_walkthrough.cjs']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          path: product
          ref: 59297be5c8b1e37caefb289e9372a930edc8af1b
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: product/requirements.txt
      - name: Prepare the recorded release and repository's local backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-loopback-stub-anon-key-not-a-real-key
          BACKEND_URL: http://127.0.0.1:8100
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          cd product
          python -m pip install -q -r requirements.txt
          python scripts/shard_corpus.py assemble
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
      - name: Record the local UI and fictional opportunity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/demo"
          (cd product && python -m uvicorn backend.main:app --host 127.0.0.1 --port 8100) >"$RUNNER_TEMP/backend.log" 2>&1 &
          (cd product/frontend && node e2e/supabase-stub.mjs) >"$RUNNER_TEMP/profile.log" 2>&1 &
          (cd product/frontend && npm run start -- --port 3100 --hostname 127.0.0.1) >"$RUNNER_TEMP/frontend.log" 2>&1 &
          for run in {1..125}; do
            if curl -fsS --max-time 5 http://127.0.0.1:8100/api/health >/dev/null && curl -fsS --max-time 5 http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture_u31_walkthrough.cjs "$GITHUB_WORKSPACE/product/frontend" "$RUNNER_TEMP/demo"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: u31-walkthrough-frames
          path: ${{ runner.temp }}/demo
