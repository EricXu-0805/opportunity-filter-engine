name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR pushes only; never kill an in-flight main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Surface Node 24 breakage now, on our schedule, ahead of GitHub's
  # June 16 2026 forced migration of node20 actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # On a push to main, decides whether the four test jobs below may be skipped
  # because the pull request already ran them on this exact tree. Until this
  # job every merge ran the suite a second time on main, a median 60 minutes
  # in front of the backend deploy (22 green runs on main, 2026-11-01 to
  # 11-14), and a flake there held the backend back while Vercel had already
  # shipped the frontend (2026-11-13: one failed Frontend unit-test step on
  # 52124020 put the deploy hook 3h08m after the merge).
  #
  # scripts/ci_skip_decision.py answers skip only on proof: this commit is the
  # merge commit of exactly one merged pull request whose head is in this
  # repository; its tree is the tree of that head; the commit main was on is
  # an ancestor of that head, so the pull_request run, which tests the head
  # merged into main, tested this tree; and the newest pull_request run of
  # this workflow for that head succeeded with Backend, Frontend, Migrations
  # and E2E each `success`. An API error, a missing or ambiguous answer, a
  # failed checkout or a crash of the script is skip=false: the suite runs.
  #
  # The cases thought through:
  # - A manual dispatch never skips: the script refuses every event but a
  #   push, and the output below repeats that. It is how to run the suite on
  #   main by hand: `gh workflow run ci.yml --ref main`.
  # - A re-run of an older main run decides again from the same facts. If it
  #   skips, deploy-backend still deploys nothing once main has moved.
  # - A pull request merged with --admin while behind main: the merge commit's
  #   tree is not the head's tree, or main's commit is not in the head. Runs.
  # - A revert, or anything else pushed straight to main, has no pull request.
  #   Runs.
  # - Two pull requests with one head sha: if the commit lists both, that is
  #   ambiguous and the suite runs. If it lists one, every pull_request run
  #   for that head tested the same tree, and only the newest counts.
  # - A pull request whose CI failed and was re-run: the run's conclusion and
  #   its job list are those of the last attempt.
  # - A pull request whose Migrations job failed, which branch protection does
  #   not require: its run did not succeed. Runs.
  decide:
    name: Decide (run or skip the suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read access only, for the lookups above.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.decide.outputs.skip == 'true' }}
    steps:
      - uses: actions/checkout@v6
        # Only the script, not the corpus. A failed checkout leaves no script,
        # and the step below then answers skip=false.
        continue-on-error: true
        with:
          sparse-checkout: scripts/ci_skip_decision.py
          sparse-checkout-cone-mode: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_skip_decision.py || {
            echo "::warning::scripts/ci_skip_decision.py did not run to the end, so the suite runs."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          }

  backend:
    name: Backend (lint + pytest)
    needs: decide
    # !cancelled() rather than the default success(): if `decide` itself
    # fails, its output is empty and the suite runs. The same line is on the
    # other three test jobs.
    if: ${{ !cancelled() && needs.decide.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    # PR #974 passed all 4,927 tests in 28m18s, but setup and cleanup
    # brought the job past its old 30-minute cap (run 35967896474).
    # Keep the full suite and leave measured runner/setup headroom. Durations
    # below expose the corpus-bound tests to optimize without dropping checks.
    # The MVP integration (PR #1002) roughly doubled the suite: 9,522 tests
    # ran in 26m10s (run 36680215980), so 35 minutes no longer left headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint tools
        run: pip install ruff==0.7.4

      - name: Lint (ruff)
        run: ruff check backend src tests --output-format=github

      # The dependency audits live in the non-required `security-advisory` job
      # below. They used to sit here (and in the Frontend job) under
      # `continue-on-error: true`, which meant a required job carried a step
      # whose failure was ignored: the checks list showed a green "Dependency
      # audit" that could not fail anything. A required job must not contain a
      # step whose failure is ignored — either it gates or it lives elsewhere.

      - name: Assemble corpus work file from shards
        # The corpus is committed as per-school shards (GitHub's 100 MB blob
        # limit); tests read the single assembled work file. Stdlib-only.
        #
        # This step is a real gate, not a formality: assemble enforces a
        # minimum-record floor (shard_corpus.MIN_ASSEMBLED_RECORDS) and exits
        # non-zero below it. Without that floor an empty/absent shards
        # directory wrote `[]` and exited 0, and the 53 data-quality tests that
        # skip when the work file is absent would have skipped on a ~0-record
        # corpus too — pytest exits 0 with the data-quality gate vacuously
        # green. A checkout with the shards missing now fails here instead.
        run: python scripts/shard_corpus.py assemble

      - name: Run pytest
        run: pytest tests/ -v --tb=short --durations=20

  frontend:
    name: Frontend (typecheck + build)
    needs: decide
    if: ${{ !cancelled() && needs.decide.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    # 10 was set when the unit suite was a fraction of its current size. The
    # suite is now 3,846 tests — 4.5 minutes of pure vitest on a warm laptop —
    # and this job also runs npm ci, tsc, lint and a full Next build on top.
    # Every run was being killed at 10m14s, which reads as a test failure and
    # is not one: the log ends in "Terminate orphan process: npm test". Same
    # shape as the Backend job's 10 -> 30 bump for the same reason.
    timeout-minutes: 22
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # No `--if-present`: with it, deleting the "lint" script from
        # package.json silently turned this gate into a pass (npm exits 0 when
        # the script is missing). A missing lint script must fail loudly.
        run: npm run lint

      # The npm dependency audit moved to the non-required `security-advisory`
      # job below — see the note in the Backend job.

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  migrations:
    name: Migrations (Flow B merge + CLI replay)
    needs: decide
    if: ${{ !cancelled() && needs.decide.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      # Keep both the setup action and CLI release pinned: migration-history
      # semantics are part of the deployment contract, not a moving CI input.
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.95.4

      - name: Ensure PostgreSQL tools on PATH
        run: |
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$PGBIN" ] || [ ! -x "$PGBIN/initdb" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
            PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          fi
          echo "$PGBIN" >> "$GITHUB_PATH"

      # Spins an ephemeral cluster (non-root runner → initdb is happy), loads
      # the effective prod schema + migration 017, runs the merge/security
      # assertions. Guards the only data-loss surface against schema drift.
      - name: Flow B merge test (ephemeral Postgres)
        run: bash supabase/tests/run_flow_b_test.sh

      # Full-chain replay with the real CLI: catches duplicate version
      # prefixes and dependency-order failures (e.g. 006's DROP FUNCTION)
      # that the psql loop above cannot, and asserts the history table.
      - name: Real Supabase migration-history contract
        run: bash supabase/tests/run_supabase_cli_migration_test.sh

  e2e:
    name: E2E (Playwright)
    needs: decide
    if: ${{ !cancelled() && needs.decide.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    # Headroom over the typical run; the suite now boots a production server
    # (see the build step below + playwright.config webServer) instead of the
    # slow on-demand-compiling dev server, so it completes well inside this.
    # 45 since the MVP integration: 61 spec files instead of 22.
    timeout-minutes: 45
    # It needs neither Backend nor Frontend: it installs its own backend
    # dependencies and builds the frontend itself, so it starts with the other
    # three. While it waited for those two, Backend's 34 minutes came before
    # its 27 (medians of 58 green runs, 2026-11-01 to 11-14) and the four jobs
    # took 61 minutes together. deploy-backend below still needs all four.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Normally <1 min; CDN downloads have stalled for hours, so fail fast.
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        # Browsers restored from cache still need the apt packages each run.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build frontend (E2E runs against a production server, not dev)
        # next dev compiles each route on first hit, which made the suite blow
        # past the job timeout. Building once + `next start` (see
        # playwright.config webServer) serves pre-compiled routes, cutting the
        # run dramatically. The Frontend job already proves `npm run build`
        # passes in CI.
        #
        # BACKEND_URL must be set at BUILD time: next.config.js rewrites are
        # baked into routes-manifest.json during `next build` and are NOT
        # re-evaluated by `next start` — without it the built app proxies
        # /api/* to the LIVE production backend instead of the local uvicorn
        # the Playwright webServer boots.
        #
        # The NEXT_PUBLIC_* pair must ALSO be baked here (values mirror
        # frontend/playwright.config.ts): the client bundle inlines them at
        # build time, and the app follows persistence rather than flipping
        # optimistically — built without a storage backend, tracker/favorites
        # are correctly inert and every persistence spec fails. `next dev`
        # injects them per-request, so only the CI production build needs this.
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-loopback-stub-anon-key-not-a-real-key

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # Deploys the backend through a Render deploy hook once the checks branch
  # protection requires, and the Migrations check, have passed: on this
  # commit, or, when `decide` skipped them, on the pull request that carried
  # this tree. render.yaml's
  # `autoDeployTrigger: checksPass` waits for EVERY check run on the commit
  # and has no notion of "required", so an unrelated run on main (a red
  # advisory, a refresh dispatched on main) has held backend deploys, once
  # for four days (docs/RELEASE.md §3). This job waits only for these four.
  # Branch protection does not require Migrations, so a commit can reach main
  # with it red; waiting for it keeps that commit off the live backend.
  #
  # Until RENDER_DEPLOY_HOOK_URL is set it deploys nothing and succeeds, so
  # its own check can never hold today's checksPass deploy. The switch-over,
  # which sets the secret and turns checksPass off together, is in
  # docs/RELEASE.md.
  deploy-backend:
    name: Deploy backend (Render hook)
    needs: [decide, backend, frontend, migrations, e2e]
    # A push to main only: never a pull request, a manual dispatch or a
    # schedule. Under the default success() a skipped need skips this job,
    # and the four test jobs are skipped whenever `decide` says so. The
    # condition therefore carries its own status function and names every
    # result. It deploys in two cases only: `decide` proved the tree and all
    # four jobs were skipped, or all four ran here and succeeded. A test job
    # that failed or was cancelled, a `decide` that did not succeed, or a
    # cancelled run deploys nothing.
    if: >-
      ${{
        !cancelled()
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
        && needs.decide.result == 'success'
        && (
          (needs.decide.outputs.skip == 'true'
            && needs.backend.result == 'skipped' && needs.frontend.result == 'skipped'
            && needs.migrations.result == 'skipped' && needs.e2e.result == 'skipped')
          || (needs.backend.result == 'success' && needs.frontend.result == 'success'
            && needs.migrations.result == 'success' && needs.e2e.result == 'success')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read access only, to look up the head of main.
    permissions:
      contents: read
    steps:
      - name: Ask Render to deploy this commit
        # The hook URL carries a key, and anyone holding it can deploy. It
        # reaches the script only through env and is never printed. `ref`
        # pins the deploy to this commit rather than whatever is at the head
        # of main when Render builds.
        #
        # A re-run of an older main run is still a push to main and still
        # carries that commit's own sha, so it passes the `if` above. Deploying
        # it would build the older commit over a newer one, and a ref-pinned
        # hook call turns Render's auto-deploy off, so nothing would undo that.
        # The script therefore deploys only while this sha is the head of
        # main; otherwise the newer commit's own run deploys it.
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set, so this job deployed nothing. Render's own auto-deploy (render.yaml autoDeployTrigger) still decides; docs/RELEASE.md has the switch-over."
            exit 0
          fi
          rc=0
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha) || rc=$?
          if [ "$rc" -ne 0 ] || ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the head of main (gh exit $rc), so $DEPLOY_SHA was NOT deployed. Re-run this job only while $DEPLOY_SHA is still the head of main."
            exit 1
          fi
          if [ "$head" != "$DEPLOY_SHA" ]; then
            echo "::notice::main has moved from $DEPLOY_SHA to $head, so this run deployed nothing; the run for $head deploys it. If that run failed or was cancelled, re-run that one, never this one."
            exit 0
          fi
          case "$RENDER_DEPLOY_HOOK_URL" in
            *'?'*) sep='&' ;;
            *) sep='?' ;;
          esac
          rc=0
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST \
            "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${DEPLOY_SHA}") || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::The deploy-hook request did not complete (curl exit $rc), so $DEPLOY_SHA was NOT deployed. Re-run this job once Render answers, and only while $DEPLOY_SHA is still the head of main."
            exit 1
          fi
          case "$status" in
            2??)
              echo "Render accepted the deploy of $DEPLOY_SHA (HTTP $status)."
              ;;
            *)
              echo "::error::The Render deploy hook answered HTTP $status, so $DEPLOY_SHA was NOT deployed. A 404 usually means the hook was regenerated and the secret still holds the old URL."
              exit 1
              ;;
          esac

  # The dependency audits moved to .github/workflows/security-advisory.yml,
  # which runs on pull_request only. They stayed non-required either way; what
  # changed is that they no longer attach a check run to a main commit, because
  # Render's `autoDeployTrigger: checksPass` waits on EVERY check and a red
  # advisory therefore froze backend deploys. See that file's header.
