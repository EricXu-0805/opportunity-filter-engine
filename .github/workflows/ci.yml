name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR pushes only; never kill an in-flight main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Surface Node 24 breakage now, on our schedule, ahead of GitHub's
  # June 16 2026 forced migration of node20 actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint/audit tools
        run: pip install ruff==0.7.4 pip-audit==2.7.3

      - name: Lint (ruff)
        run: ruff check backend src tests --output-format=github

      - name: Dependency audit (pip-audit)
        run: pip-audit --requirement requirements.txt --strict --ignore-vuln GHSA-4xh5-x5gv-qwph
        continue-on-error: true

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Headroom over the typical run; the suite now boots a production server
    # (see the build step below + playwright.config webServer) instead of the
    # slow on-demand-compiling dev server, so it completes well inside this.
    timeout-minutes: 30
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Normally <1 min; CDN downloads have stalled for hours, so fail fast.
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        # Browsers restored from cache still need the apt packages each run.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build frontend (E2E runs against a production server, not dev)
        # next dev compiles each route on first hit, which made the suite blow
        # past the job timeout. Building once + `next start` (see
        # playwright.config webServer) serves pre-compiled routes, cutting the
        # run dramatically. The Frontend job already proves `npm run build`
        # passes in CI.
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
