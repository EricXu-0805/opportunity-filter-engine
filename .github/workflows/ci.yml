name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR pushes only; never kill an in-flight main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Surface Node 24 breakage now, on our schedule, ahead of GitHub's
  # June 16 2026 forced migration of node20 actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    # Corpus-bound: pytest assembles + validates the full multi-school corpus,
    # which grows with each onboarding wave (61k→128k across the parity waves).
    # The heavy tests used to re-parse the 300 MB+ work file once per test and
    # re-rank the whole corpus once per assertion; memoizing the corpus loaders
    # and sharing one ranker-sanity result cut the serial suite ~in half. What
    # remains is inherent per-profile rank_all-over-corpus compute (one ~2 min
    # TF-IDF-fit + batch-cosine call), which grows with the corpus — if it ever
    # crowds the cap, parallelize with pytest-xdist or sample the ranker tests.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint tools
        run: pip install ruff==0.7.4

      - name: Lint (ruff)
        run: ruff check backend src tests --output-format=github

      # The dependency audits live in the non-required `security-advisory` job
      # below. They used to sit here (and in the Frontend job) under
      # `continue-on-error: true`, which meant a required job carried a step
      # whose failure was ignored: the checks list showed a green "Dependency
      # audit" that could not fail anything. A required job must not contain a
      # step whose failure is ignored — either it gates or it lives elsewhere.

      - name: Assemble corpus work file from shards
        # The corpus is committed as per-school shards (GitHub's 100 MB blob
        # limit); tests read the single assembled work file. Stdlib-only.
        #
        # This step is a real gate, not a formality: assemble enforces a
        # minimum-record floor (shard_corpus.MIN_ASSEMBLED_RECORDS) and exits
        # non-zero below it. Without that floor an empty/absent shards
        # directory wrote `[]` and exited 0, and the 53 data-quality tests that
        # skip when the work file is absent would have skipped on a ~0-record
        # corpus too — pytest exits 0 with the data-quality gate vacuously
        # green. A checkout with the shards missing now fails here instead.
        run: python scripts/shard_corpus.py assemble

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # No `--if-present`: with it, deleting the "lint" script from
        # package.json silently turned this gate into a pass (npm exits 0 when
        # the script is missing). A missing lint script must fail loudly.
        run: npm run lint

      # The npm dependency audit moved to the non-required `security-advisory`
      # job below — see the note in the Backend job.

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  migrations:
    name: Migrations (Flow B merge + CLI replay)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      # Keep both the setup action and CLI release pinned: migration-history
      # semantics are part of the deployment contract, not a moving CI input.
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.95.4

      - name: Ensure PostgreSQL tools on PATH
        run: |
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$PGBIN" ] || [ ! -x "$PGBIN/initdb" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
            PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          fi
          echo "$PGBIN" >> "$GITHUB_PATH"

      # Spins an ephemeral cluster (non-root runner → initdb is happy), loads
      # the effective prod schema + migration 017, runs the merge/security
      # assertions. Guards the only data-loss surface against schema drift.
      - name: Flow B merge test (ephemeral Postgres)
        run: bash supabase/tests/run_flow_b_test.sh

      # Full-chain replay with the real CLI: catches duplicate version
      # prefixes and dependency-order failures (e.g. 006's DROP FUNCTION)
      # that the psql loop above cannot, and asserts the history table.
      - name: Real Supabase migration-history contract
        run: bash supabase/tests/run_supabase_cli_migration_test.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Headroom over the typical run; the suite now boots a production server
    # (see the build step below + playwright.config webServer) instead of the
    # slow on-demand-compiling dev server, so it completes well inside this.
    timeout-minutes: 30
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Normally <1 min; CDN downloads have stalled for hours, so fail fast.
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        # Browsers restored from cache still need the apt packages each run.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build frontend (E2E runs against a production server, not dev)
        # next dev compiles each route on first hit, which made the suite blow
        # past the job timeout. Building once + `next start` (see
        # playwright.config webServer) serves pre-compiled routes, cutting the
        # run dramatically. The Frontend job already proves `npm run build`
        # passes in CI.
        #
        # BACKEND_URL must be set at BUILD time: next.config.js rewrites are
        # baked into routes-manifest.json during `next build` and are NOT
        # re-evaluated by `next start` — without it the built app proxies
        # /api/* to the LIVE production backend instead of the local uvicorn
        # the Playwright webServer boots.
        #
        # The NEXT_PUBLIC_* pair must ALSO be baked here (values mirror
        # frontend/playwright.config.ts): the client bundle inlines them at
        # build time, and the app follows persistence rather than flipping
        # optimistically — built without a storage backend, tracker/favorites
        # are correctly inert and every persistence spec fails. `next dev`
        # injects them per-request, so only the CI production build needs this.
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-loopback-stub-anon-key-not-a-real-key

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # The dependency audits moved to .github/workflows/security-advisory.yml,
  # which runs on pull_request only. They stayed non-required either way; what
  # changed is that they no longer attach a check run to a main commit, because
  # Render's `autoDeployTrigger: checksPass` waits on EVERY check and a red
  # advisory therefore froze backend deploys. See that file's header.
