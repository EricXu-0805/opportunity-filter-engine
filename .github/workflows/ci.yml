name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR pushes only; never kill an in-flight main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Surface Node 24 breakage now, on our schedule, ahead of GitHub's
  # June 16 2026 forced migration of node20 actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    # Corpus-bound: pytest assembles + validates the full multi-school corpus,
    # which grows with each onboarding wave (61k→80k at Wave-2). The serial
    # suite now runs ~12-14 min on CI and was tripping the old 10-min cap
    # (both this branch and restore-yale-shard hit it). Durable follow-up:
    # parallelize with pytest-xdist or sample the corpus in the heavy tests.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint/audit tools
        run: pip install ruff==0.7.4 pip-audit==2.7.3

      - name: Lint (ruff)
        run: ruff check backend src tests --output-format=github

      - name: Dependency audit (pip-audit)
        run: pip-audit --requirement requirements.txt --strict --ignore-vuln GHSA-4xh5-x5gv-qwph
        continue-on-error: true

      - name: Assemble corpus work file from shards
        # The corpus is committed as per-school shards (GitHub's 100 MB blob
        # limit); tests read the single assembled work file. Stdlib-only.
        run: python scripts/shard_corpus.py assemble

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  migrations:
    name: Migrations (Flow B merge)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      - name: Ensure PostgreSQL tools on PATH
        run: |
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$PGBIN" ] || [ ! -x "$PGBIN/initdb" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
            PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          fi
          echo "$PGBIN" >> "$GITHUB_PATH"

      # Spins an ephemeral cluster (non-root runner → initdb is happy), loads
      # the effective prod schema + migration 017, runs the merge/security
      # assertions. Guards the only data-loss surface against schema drift.
      - name: Flow B merge test (ephemeral Postgres)
        run: bash supabase/tests/run_flow_b_test.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Headroom over the typical run; the suite now boots a production server
    # (see the build step below + playwright.config webServer) instead of the
    # slow on-demand-compiling dev server, so it completes well inside this.
    timeout-minutes: 30
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Normally <1 min; CDN downloads have stalled for hours, so fail fast.
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        # Browsers restored from cache still need the apt packages each run.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build frontend (E2E runs against a production server, not dev)
        # next dev compiles each route on first hit, which made the suite blow
        # past the job timeout. Building once + `next start` (see
        # playwright.config webServer) serves pre-compiled routes, cutting the
        # run dramatically. The Frontend job already proves `npm run build`
        # passes in CI.
        #
        # BACKEND_URL must be set at BUILD time: next.config.js rewrites are
        # baked into routes-manifest.json during `next build` and are NOT
        # re-evaluated by `next start` — without it the built app proxies
        # /api/* to the LIVE production backend instead of the local uvicorn
        # the Playwright webServer boots.
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8100

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
