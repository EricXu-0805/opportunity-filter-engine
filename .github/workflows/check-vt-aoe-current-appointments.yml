name: Read ten AOE department-group and personal-role detail screens
on:
  push:
    branches: [audit/pitt-duke-affiliates-20261126]
    paths:
      - '.github/workflows/check-vt-aoe-current-appointments.yml'
      - 'data/audits/observed-faculty-2026-11-26/vt-aoe-current-appointments/browser.py'
permissions:
  contents: read
jobs:
  details:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE: 09b348c6faff83cedeeb967e2af7dd20b600197d
      BACKEND_URL: http://127.0.0.1:8100
      OFE_RELEASE_SHA: 09b348c6faff83cedeeb967e2af7dd20b600197d
      OFE_ENVIRONMENT: isolated-candidate
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 09b348c6faff83cedeeb967e2af7dd20b600197d
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: candidate/frontend/package-lock.json
      - name: Install normal runtime and Chromium
        run: |
          python -m pip install -q -r candidate/requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium >"$RUNNER_TEMP/chromium.log"
          npm ci --prefix candidate/frontend --no-audit --no-fund
      - name: Build the exact candidate and assemble its full corpus
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          python scripts/shard_corpus.py assemble --force
          npm --prefix frontend run build
      - name: Read five ordinary saved public details in both languages
        working-directory: candidate
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8100 >"$RUNNER_TEMP/ofe-api.log" 2>&1 &
          npm --prefix frontend run start -- --hostname 127.0.0.1 --port 3000 >"$RUNNER_TEMP/ofe-next.log" 2>&1 &
          for attempt in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:3000/api/health >"$RUNNER_TEMP/ofe-health.json"; then break; fi
            sleep 2
          done
          python ../audit/data/audits/observed-faculty-2026-11-26/vt-aoe-current-appointments/browser.py "$GITHUB_WORKSPACE/vt-current"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vt-current-role-details
          path: vt-current/
          if-no-files-found: warn
