name: Read ten AOE department-group and personal-role detail screens
on:
  push:
    branches: [audit/pitt-duke-affiliates-20261126]
    paths:
      - '.github/workflows/check-vt-aoe-current-appointments.yml'
      - 'data/audits/observed-faculty-2026-11-26/vt-aoe-current-appointments/browser.py'
permissions:
  contents: read
jobs:
  details:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE: af88777313d59d5b5402054f0ce39868e960a6a4
      BACKEND_URL: http://127.0.0.1:8100
      OFE_RELEASE_SHA: af88777313d59d5b5402054f0ce39868e960a6a4
      OFE_ENVIRONMENT: isolated-candidate
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v6
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: af88777313d59d5b5402054f0ce39868e960a6a4
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: candidate/frontend/package-lock.json
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.95.4
      - name: Start the isolated account and profile database from the candidate migrations
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/msuroles"
          mkdir -p "$fixture"
          cd "$fixture"
          supabase init
          mkdir -p supabase/migrations
          source_sql="$GITHUB_WORKSPACE/candidate/supabase/migrations"
          for file in "$source_sql"/*.sql; do
            if [[ "$(basename "$file")" != 20261125130000_guard_tracker_attachment_replacement.sql ]]; then
              cp "$file" supabase/migrations/
            fi
          done
          sed -i 's/^enable_anonymous_sign_ins = false/enable_anonymous_sign_ins = true/' supabase/config.toml
          supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >"$fixture/start.log" 2>&1
          docker exec -i supabase_db_msuroles sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql -h 127.0.0.1 -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres' < "$source_sql/20261125130000_guard_tracker_attachment_replacement.sql"
          umask 077
          supabase status -o json >"$fixture/status.json"
          jq -r '"NEXT_PUBLIC_SUPABASE_ANON_KEY=" + .ANON_KEY, "SUPABASE_SERVICE_ROLE_KEY=" + .SERVICE_ROLE_KEY, "SUPABASE_URL=" + .API_URL' "$fixture/status.json" >> "$GITHUB_ENV"
      - name: Install normal runtime and Chromium
        run: |
          python -m pip install -q -r candidate/requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium >"$RUNNER_TEMP/chromium.log"
          npm ci --prefix candidate/frontend --no-audit --no-fund
      - name: Build the exact candidate and assemble its full corpus
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          python scripts/shard_corpus.py assemble --force
          npm --prefix frontend run build
      - name: Read five ordinary saved public details in both languages
        working-directory: candidate
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8100 >"$RUNNER_TEMP/ofe-api.log" 2>&1 &
          npm --prefix frontend run start -- --hostname 127.0.0.1 --port 3000 >"$RUNNER_TEMP/ofe-next.log" 2>&1 &
          for attempt in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:3000/api/health >"$RUNNER_TEMP/ofe-health.json"; then break; fi
            sleep 2
          done
          python ../audit/data/audits/observed-faculty-2026-11-26/vt-aoe-current-appointments/browser.py "$GITHUB_WORKSPACE/vt-current"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vt-current-role-details
          path: vt-current/
          if-no-files-found: warn
