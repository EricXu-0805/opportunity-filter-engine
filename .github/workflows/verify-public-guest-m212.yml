name: Verify a legacy skill conflict in the official profile form
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/verify-public-guest-m212.yml', 'scripts/verify_public_guest_m212.py']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m pip install --quiet playwright==1.55.0
      - run: python -u scripts/verify_public_guest_m212.py
