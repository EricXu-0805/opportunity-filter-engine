name: Verify confirmed current PDF excerpts in matching
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/verify-m17-resume-confirmed.yml', 'scripts/verify_m17_current_pdf_candidate.py']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out the reviewed application commit
        uses: actions/checkout@v6
        with:
          ref: 7c6b3e1f4b7c073fd8586a37546492d93dd6702c
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.95.4
      - name: Start disposable profile database, Auth and PostgREST
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/m212"
          mkdir -p "$fixture"; cd "$fixture"; supabase init
          mkdir -p supabase/migrations
          src="$GITHUB_WORKSPACE/product/supabase/migrations"
          cp "$src"/*.sql supabase/migrations/
          rm -f supabase/migrations/20261125130000_guard_tracker_attachment_replacement.sql
          sed -i 's/^enable_anonymous_sign_ins = false/enable_anonymous_sign_ins = true/' supabase/config.toml
          if ! supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >"$fixture/start.log" 2>&1; then
            grep -Ei 'error|failed|fatal|denied' "$fixture/start.log" | tail -8 | cut -c1-220 || true
            exit 1
          fi
          # Storage finishes creating its schema at startup. Apply its trigger now in this disposable container.
          docker exec -i supabase_db_m212 sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql -h 127.0.0.1 -X -v ON_ERROR_STOP=1 -U supabase_admin -d postgres' < "$src/20261125130000_guard_tracker_attachment_replacement.sql"
          umask 077
          supabase status -o json >"$fixture/status.json"
          docker ps --format '{{.Image}}' | grep -E 'postgrest|gotrue|supabase/postgres:'
      - name: Install locked frontend and Chromium
        working-directory: product/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run predev --if-present
      - name: Exercise normal application controls against real GoTrue and PostgREST
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/m212/status.json"
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(jq -r .ANON_KEY "$cfg")"
          export NEXT_TELEMETRY_DISABLED=1
          export BACKEND_URL=http://127.0.0.1:8100
          python -m pip install --quiet -r product/requirements.txt playwright==1.55.0
          export PYTHONPATH="$GITHUB_WORKSPACE/product"
          python -u scripts/verify_m17_matching_experience.py --serve >"$RUNNER_TEMP/m17-api.log" 2>&1 &
          for attempt in {1..40}; do if curl -fsS --max-time 5 http://127.0.0.1:8100/api/opportunities/e2e-actionable-research >/dev/null 2>&1; then break; fi; sleep 1; done
          (cd product/frontend && node node_modules/next/dist/bin/next dev --webpack --hostname 127.0.0.1 --port 3100) >"$RUNNER_TEMP/frontend.log" 2>&1 &
          for attempt in {1..80}; do if curl -fsS --max-time 15 http://127.0.0.1:3100/ >/dev/null 2>&1; then break; fi; sleep 1; done
          python -u scripts/verify_m17_current_pdf_candidate.py "$cfg"
          python -u scripts/verify_m17_long_experience_recovery.py "$cfg"
