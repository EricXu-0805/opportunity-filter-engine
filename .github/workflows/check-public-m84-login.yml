name: Check the provider buttons in the released login dialog
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/check-public-m84-login.yml', 'scripts/verify_public_login_dialog.py']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet playwright==1.55.0
      - run: python -u scripts/verify_public_login_dialog.py
