name: Verify confirmed publication identity on the deployed profile
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/check-official-student-authorship.yml', 'scripts/verify_public_student_authorship.py']
permissions:
  contents: read
jobs:
  official:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      OFE_EXPECTED_SITE_SHA: 1bff5dbed56cb3a324d3a73abd4b4fb5c06ec0bf
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet playwright==1.55.0
      - name: Use the official student profile and résumé publication controls
        run: python -u scripts/verify_public_student_authorship.py
