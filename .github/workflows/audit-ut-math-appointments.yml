name: Read original UT Mathematics appointments and both university roles
on:
  push:
    branches: [audit/ut-math-verified-appointments-20261127]
    paths: ['scripts/verify_ut_math_original_appointments.py','.github/workflows/audit-ut-math-appointments.yml']
permissions:
  contents: read
jobs:
  official-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 587b29ba137629f3b2d2d45bb85d105b9d7a53f9
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet -r requirements.txt playwright==1.55.0
      - run: python candidate/scripts/shard_corpus.py assemble --force
      - run: PYTHONPATH=. UT_MATH_CANDIDATE_PATH="$GITHUB_WORKSPACE/candidate" python scripts/verify_ut_math_original_appointments.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ut-math-originals
          path: /tmp/ut-math-originals.json
