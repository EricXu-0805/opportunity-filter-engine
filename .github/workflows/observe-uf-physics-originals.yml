name: Check the UF Physics directory, appointments and original profile routes
on:
  push:
    branches: [audit/uf-physics-roster-20261126]
    paths:
      - '.github/workflows/observe-uf-physics-originals.yml'
      - 'data/audits/read_uf_physics_current.py'
permissions:
  contents: read
jobs:
  faculty:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: audit
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: audit/requirements.txt
      - working-directory: audit
        run: |
          pip install -q -r requirements.txt
          PYTHONPATH=. python data/audits/read_uf_physics_current.py
      - uses: actions/upload-artifact@v6
        with:
          name: uf-physics-official-roster-identity-and-appointments
          path: uf-physics-evidence.json
