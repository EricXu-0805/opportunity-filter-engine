name: ops-scan

# W15 built the detector that turns each refresh's artifacts into durable
# operator incidents (/api/cron/ops-scan -> _scan_collectors + _scan_drift),
# and nothing ever called it. So collector_failure and data_drift incidents
# were never created: the admin operations queue rendered an all-clear while
# collectors failed, and only notification_failure rows — written inline by
# the reminders cron — ever appeared.
#
# 07:30 UTC: after the 06:00 UTC data refresh has had time to publish its
# collector_status.json, so the scan reads that run's evidence rather than
# yesterday's. The refresh's own alert email covers a hard crash; this covers
# the quieter cases (a source that reported an error, a fetched count that
# collapsed) that no email is sent for.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

# The scan upserts by dedup_key and is idempotent, but two concurrent runs
# would still race the same rows for no benefit.
concurrency:
  group: ops-scan
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # check_cron_response.py is a repo file, so this job needs a working copy.
      - uses: actions/checkout@v6

      # This used to `exit 0` when a secret was unset, which is the worst place
      # for that: the scan is the thing that notices collectors failing, so a
      # rotated CRON_SECRET would silently disable the detector AND leave the
      # operations queue rendering an all-clear — two layers of quiet at once.
      # A missing required secret now fails the job so the alert below fires.
      # OPERATOR_EMAIL/RESEND_API_KEY stay optional: they configure the alert
      # itself (see there).
      - name: Require the secrets this cron runs on
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          for name in BACKEND_URL CRON_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing required secret(s):$missing — the ops scan cannot run, so collector_failure and data_drift incidents will not be created. Failing the job so the operator alert fires instead of reporting a green no-op."
            exit 1
          fi
          echo "required secrets present"

      - name: Fire ops-scan cron
        run: |
          # The endpoint deliberately never 500s (a monitor that pages on its
          # own failure is one more thing to monitor), so it reports trouble in
          # the body: `errors` is a list of RPC failures that left a real
          # problem unrecorded. curl -sf cannot see those; the checker reads
          # that list and fails the step. A missing-Supabase-env run reports
          # status=skipped, which the checker correctly treats as not a failure.
          curl -sfSL -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/cron/ops-scan" \
            | tee /dev/stderr \
            | python3 scripts/check_cron_response.py

      # This job had NO alert step at all: the one workflow whose entire purpose
      # is to notice trouble (it creates the collector_failure and data_drift
      # incidents) told nobody when it died — and its silence looks exactly like
      # "no incidents", which is the all-clear the operations queue then renders.
      # Same operator alert as daily-reminders.yml / refresh-data.yml, and
      # `cancelled()` too: exceeding timeout-minutes cancels rather than fails,
      # so bare `failure()` misses a hung run.
      - name: Alert operator on failure
        if: failure() || cancelled()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: |
          # Optional-by-design: these configure the alert itself, so failing on
          # them would only relocate the silence. The job's own failure is
          # already recorded in the Actions run either way.
          if [ -z "$RESEND_API_KEY" ] || [ -z "$OPERATOR_EMAIL" ]; then
            echo "::warning::RESEND_API_KEY / OPERATOR_EMAIL not set — cannot alert"
            exit 0
          fi
          # `|| true` keeps a failed send from overwriting the real failure with
          # an alerting failure. The honest cost: alert DELIVERY is unverified —
          # a rejected Resend call (bad key, suspended domain, rate limit) makes
          # this step look like it notified someone when it did not. Verifying
          # delivery needs a check on the send result that cannot itself mask
          # the original failure (e.g. record it in the run summary).
          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"${{ vars.RESEND_FROM_EMAIL || 'JoinALab <onboarding@resend.dev>' }}\",
              \"to\": [\"$OPERATOR_EMAIL\"],
              \"subject\": \"JoinALab: ops-scan cron FAILED\",
              \"text\": \"The daily ops scan failed.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nNo collector_failure or data_drift incidents were created from the last refresh's artifacts, so the admin operations queue is showing an all-clear it has not earned.\"
            }" || true
