name: Measure daily ranking evidence on one Linux worker
on:
  push:
    branches: [audit/b20-original-details-20261126]
    paths: ['.github/workflows/measure-m74-daily-ranking.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: 1
      PYTHONHASHSEED: 42
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: data/audits/m74-daily-ranking
      - uses: actions/checkout@v6
        with:
          ref: 7482cb1ba9766d61a8995aeb42884793e66689bd
          fetch-depth: 2
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: product/requirements.txt
      - run: python -m pip install -r product/requirements.txt
      - name: Four fresh processes using identical school shards
        working-directory: product
        run: |
          set -euo pipefail
          base=b129ed3336f1203ae6097a50af9e7e4f8950ac40
          candidate=7482cb1ba9766d61a8995aeb42884793e66689bd
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-parse "$base":data/processed/shards)" = "$(git rev-parse "$candidate":data/processed/shards)"
          mkdir -p ../timing
          for run in base1 candidate1 candidate2 base2; do
            case "$run" in base*) sha="$base" ;; *) sha="$candidate" ;; esac
            git checkout --quiet "$sha"
            python ../data/audits/m74-daily-ranking/compare.py run "../timing/run-$run.json"
          done
          python ../data/audits/m74-daily-ranking/compare.py compare ../timing
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: full-linux-ranking-and-memory
          path: timing/
