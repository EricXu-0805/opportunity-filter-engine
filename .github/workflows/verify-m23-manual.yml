name: Verify M23 manual program evidence
on:
  push:
    branches: [codex/diagnose-m04-public-targets]
    paths: ['data/audits/verify_m23_manual_20261126.py']
permissions:
  contents: read
jobs:
  results:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/audits
          persist-credentials: false
      - run: python -m pip install playwright==1.58.0
      - run: python data/audits/verify_m23_manual_20261126.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-program-evidence
          path: evidence/
