name: Check the two campus navigation assertions without production access
on:
  push:
    branches: [audit/m180-archived-faculty-summary-1126]
    paths:
      - 'data/audits/maintenance-2026-11-26/b21_nc_state_destinations.py'
      - 'data/audits/maintenance-2026-11-26/check_b21_nc_state_navigation_controls.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log"
      - name: Check the two links and a broken-campus control
        run: python data/audits/maintenance-2026-11-26/check_b21_nc_state_navigation_controls.py
