name: saved-searches-refresh

on:
  schedule:
    - cron: '30 23 * * *'   # 23:30 UTC = 6:30pm CDT / 5:30pm CST — evening; +30m off reminders so a user due both isn't double-buzzed at once
  workflow_dispatch:

# One run at a time (W14): the pipelines are scan-and-send with no server
# lock — a manual dispatch racing the schedule would double-send reminders
# or digests. Later runs queue rather than cancel (cancel could kill a
# half-done batch and delay bookkeeping).
concurrency:
  group: saved-searches-refresh
  cancel-in-progress: false

env:
  # Surface Node 24 breakage now, on our schedule, ahead of GitHub's
  # June 16 2026 forced migration of node20 actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # W15: the cron-response checker below lives in the repo, so this job
      # (previously a pure curl with no working copy) needs a checkout.
      - uses: actions/checkout@v6

      # Both steps below used to `exit 0` when a secret was unset: the run went
      # green, the `if: failure()` alert never fired, and a rotated CRON_SECRET
      # or a renamed BACKEND_URL became an invisible nightly no-op. The secrets
      # this cron cannot work without are now a hard failure, up front, so the
      # alert path below actually fires. OPERATOR_EMAIL stays optional — the
      # alert step is its only consumer (see there).
      - name: Require the secrets this cron runs on
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          for name in BACKEND_URL CRON_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing required secret(s):$missing — saved-search alerts and digests cannot be refreshed or delivered. Failing the job so the operator alert fires instead of reporting a green no-op."
            exit 1
          fi
          echo "required secrets present"

      - name: Fire saved-searches cron
        run: |
          # W15: a 200 with failures inside is still a failure — the body
          # carries the W14 bookkeeping counters and the digest's partial
          # status, which `curl -sf` cannot see. Piping through the checker
          # fails the step so the operator-alert job below actually fires.
          curl -sfSL \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/cron/saved-searches/refresh" \
            | tee /dev/stderr \
            | python3 scripts/check_cron_response.py
      - name: Fire saved-searches digest
        run: |
          # W15: a 200 with failures inside is still a failure — the body
          # carries the W14 bookkeeping counters and the digest's partial
          # status, which `curl -sf` cannot see. Piping through the checker
          # fails the step so the operator-alert job below actually fires.
          curl -sfSL \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/cron/saved-searches/digest" \
            | tee /dev/stderr \
            | python3 scripts/check_cron_response.py

      # Dead man's switch (migration 032): the alert below fires when this run
      # fails, and says nothing at all when it stops running.
      - name: Check in to the dead man's switch
        run: |
          curl -sfSL -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"saved_searches_refresh","detail":{"run_id":"${{ github.run_id }}"}}' \
            "${{ secrets.BACKEND_URL }}/api/cron/heartbeat"

      # Cron failures send no notification by default — the data-refresh
      # pipeline once failed 7 runs in a row before anyone noticed. Same
      # operator alert as refresh-data.yml, including `cancelled()`: blowing
      # past timeout-minutes CANCELS a job rather than failing it, so bare
      # `failure()` stayed silent on exactly the runs that hung.
      - name: Alert operator on failure
        if: failure() || cancelled()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: |
          # Optional-by-design: these configure the alert itself, so failing on
          # them would only relocate the silence. The job's own failure is
          # already recorded in the Actions run either way.
          if [ -z "$RESEND_API_KEY" ] || [ -z "$OPERATOR_EMAIL" ]; then
            echo "::warning::RESEND_API_KEY / OPERATOR_EMAIL not set — cannot alert"
            exit 0
          fi
          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"${{ vars.RESEND_FROM_EMAIL || 'JoinALab <onboarding@resend.dev>' }}\",
              \"to\": [\"$OPERATOR_EMAIL\"],
              \"subject\": \"JoinALab: saved-searches refresh FAILED\",
              \"text\": \"The scheduled saved-searches refresh/digest failed.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nSaved-search alerts and digests did not go out this cycle.\"
            }" || true
