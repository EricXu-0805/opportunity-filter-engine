name: Check an existing anonymous profile across the work-history deployment
on:
  push:
    branches: [codex/verify-m11-coursework]
    paths: [data/audits/m11-coursework/upgrade.json]
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            data/audits/m11-coursework
      - run: python -m pip install --quiet playwright==1.55.0
      - name: Follow the same guest before and after the verified production rollout
        env:
          PDF_ACCEPTANCE_MODE: fixed
          VERIFY_GUEST_ACROSS_RELEASE: '1'
        run: python -u data/audits/m11-coursework/positions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M15-across-release
          path: m11-results/*.json
          if-no-files-found: error
