name: Verify public guest matching and unsent template
on:
  push:
    branches: [codex/diagnose-nov25-roster-sources]
    paths:
      - '.github/workflows/public-guest-acceptance.yml'
      - 'data/audits/verify_public_guest_20261126.py'
permissions:
  contents: read
jobs:
  visitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: [amherst, shared]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: data/audits
      - run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - run: python -u data/audits/verify_public_guest_20261126.py
        env:
          CHECK_CASE: ${{ matrix.case }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-guest-${{ matrix.case }}
          path: evidence/*.png
          if-no-files-found: ignore
          retention-days: 30
