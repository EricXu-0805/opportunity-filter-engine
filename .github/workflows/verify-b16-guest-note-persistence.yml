name: Verify a private note saved with a real B16 guest
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/verify-b16-guest-note-persistence.yml', 'scripts/verify_deployed_b15_keyboard.py']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        journey: [detail]
    env:
      OFE_TEST_OWN_NOTE: '1'
      OFE_EXPECTED_SITE_SHA: c1b0c3c21b3c806bbf9b7b6ff95ece078f98d541
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet playwright==1.55.0
      - run: python -m playwright install chromium --with-deps >"$RUNNER_TEMP/install.log"
      - run: xvfb-run -a -s '-screen 0 1600x1100x24' python -u scripts/verify_deployed_b15_keyboard.py "${{ matrix.journey }}"
