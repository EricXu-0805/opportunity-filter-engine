name: Check a self-authored two-column PDF in the mobile profile editor
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['scripts/verify_deployed_m44_two_columns.py','.github/workflows/verify-m44-two-column-input.yml']
permissions:
  contents: read
jobs:
  upload_two_columns:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      OFE_EXPECTED_SITE_SHA: 428516b07eb63bdc1bc31693a7d399f51bc6bd96
      OFE_M44_COLUMNS_RECEIPT: /tmp/m44-two-column-readback.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet playwright==1.55.0 pypdf==5.9.0
      - run: python -u scripts/verify_deployed_m44_two_columns.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m44-two-column-source
          path: /tmp/m44-two-column-readback.json
