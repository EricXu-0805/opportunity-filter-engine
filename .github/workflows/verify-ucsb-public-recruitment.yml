name: Verify live UCSB recruitment with the reviewed collector
on:
  push:
    branches: [codex/diagnose-nov25-roster-sources]
    paths: [data/audits/verify_ucsb_recruitment_20261126.py]
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: data/audits
      - uses: actions/checkout@v6
        with:
          ref: 3c3e3cdc1baa8fbf197d963624f87c3b071fff22
          path: product
          sparse-checkout: |
            src
            backend/lib
            data/processed/shards
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check playwright==1.58.0 requests beautifulsoup4
      - run: python -m playwright install --only-shell chromium
      - run: python -u data/audits/verify_ucsb_recruitment_20261126.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ucsb-live-collector
          path: evidence/
          if-no-files-found: ignore
          retention-days: 30
