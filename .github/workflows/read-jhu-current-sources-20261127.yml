name: Read JHU public appointment sources
on:
  push:
    branches: [audit/jhu-current-appointment-sources-20261127]
    paths:
      - 'data/audits/jhu-current-sources-20261127/read_sources.py'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: data/audits/jhu-current-sources-20261127
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python data/audits/jhu-current-sources-20261127/read_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: jhu-public-appointment-sources
          path: jhu-current-appointment-sources.json
          retention-days: 30
