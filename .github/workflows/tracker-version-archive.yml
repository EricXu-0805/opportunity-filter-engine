name: Verify Tracker attachment revisions across account exports
on:
  push:
    branches: [codex/diagnose-m53-version-archive]
    paths: ['.github/workflows/tracker-version-archive.yml', 'frontend/scripts/verify-tracker-version-export.mjs', 'frontend/scripts/verify-tracker-version-rollback-view.mjs', 'frontend/scripts/verify-tracker-version-compat.mjs']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CANDIDATE_SHA: a4f57c1b69fbfafb8a3d5046eee6bff5117e83d6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: a4f57c1b69fbfafb8a3d5046eee6bff5117e83d6
      - uses: actions/checkout@v6
        with:
          path: audit-harness
          persist-credentials: false
          sparse-checkout: frontend/scripts
      - uses: actions/checkout@v6
        with:
          path: staged-schema
          persist-credentials: false
          ref: a3536b084f0b8dae6ef5469d224a7cef3fe0548b
          sparse-checkout: |
            supabase/migrations
            scripts
      - name: Pin the application, migrations and export RPC from the draft
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C staged-schema rev-parse HEAD)" = a3536b084f0b8dae6ef5469d224a7cef3fe0548b
          cp audit-harness/frontend/scripts/verify-tracker-version-*.mjs frontend/scripts/
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.95.4
      - name: Install the repository's locked JavaScript SDK
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start a fresh, loopback-only test project with isolated Storage policies
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/ofe-m53-storage"
          mkdir -p "$fixture"
          cd "$fixture"
          supabase init
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/supabase/migrations/008_tracker_attachments_storage.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261011090000_tracker_attachments_require_signin.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/staged-schema/supabase/migrations/20261125130000_guard_tracker_attachment_replacement.sql" supabase/migrations/
          if ! supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >"$fixture/start.log" 2>&1; then
            grep -E 'Error|ERROR|failed|FATAL|denied' "$fixture/start.log" | tail -6 | cut -c1-220 || true
            exit 1
          fi
          umask 077
          supabase status -o json >"$fixture/status.json"
          docker ps --format '{{.Image}}' | grep -E 'storage-api|supabase/postgres:'
      - run: python3 -m pip install --quiet httpx
      - name: Install isolated Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium >"$RUNNER_TEMP/attachment-browser-install.log" 2>&1
      - name: Exercise the compatibility application before, during and after the isolated rollout
        run: node frontend/scripts/verify-tracker-version-compat.mjs "$RUNNER_TEMP/ofe-m53-storage/status.json" "$RUNNER_TEMP/attachment-version-handoff.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tracker-attachment-version-handoff
          path: ${{ runner.temp }}/attachment-version-handoff.json
          if-no-files-found: error
