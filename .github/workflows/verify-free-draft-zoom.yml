name: Verify free draft at native desktop zoom
on:
  push:
    branches: [codex/diagnose-nov25-roster-sources]
    paths:
      - data/audits/verify_draft_zoom_20261126.py
permissions:
  contents: read
jobs:
  visitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: data/audits
      - run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - run: command -v xdotool || (sudo apt-get update -qq && sudo apt-get install -y xdotool)
      - run: xvfb-run -a python -u data/audits/verify_draft_zoom_20261126.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-draft-zoom
          path: evidence/
          if-no-files-found: ignore
          retention-days: 30
