name: Audit free draft attachment claims and backup
on:
  workflow_dispatch:
    inputs:
      validation:
        type: choice
        default: public
        options:
          - public
          - candidate
  push:
    branches: [audit/m46-free-copy-attachment-20261127]
    paths:
      - 'scripts/verify_m46_free_attachment_review.py'
      - '.github/workflows/audit-m46-free-attachment.yml'
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OFE_EXPECTED_SITE_SHA: observed-from-public-start-and-end
      M46_RESULT: /tmp/m46-free-attachment.json
      M46_CANDIDATE_SHA: 8077a4ddb51db7fadaaa02bcbe86da4ca1d666c2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        if: github.event_name == 'push' || inputs.validation == 'candidate'
        with:
          ref: 8077a4ddb51db7fadaaa02bcbe86da4ca1d666c2
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet playwright==1.55.0
      - name: Prepare isolated validator and its corpus
        if: github.event_name == 'push' || inputs.validation == 'candidate'
        run: |
          python -m pip install --quiet -r candidate/requirements.txt
          python candidate/scripts/shard_corpus.py assemble --force
          echo "M46_CANDIDATE_PATH=$GITHUB_WORKSPACE/candidate" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/candidate" >> "$GITHUB_ENV"
      - run: python -u scripts/verify_m46_free_attachment_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m46-free-attachment
          path: /tmp/m46-free-attachment.json
