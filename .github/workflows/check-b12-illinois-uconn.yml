name: Verify 49 Illinois originals and three UConn publications on B12
on:
  push:
    branches: [codex/verify-m212-profile-retry]
    paths: ['.github/workflows/check-b12-illinois-uconn.yml', 'data/audits/release-probes/verify_b12_illinois_uconn.py']
permissions:
  contents: read
jobs:
  official:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet playwright==1.55.0
      - run: python data/audits/release-probes/verify_b12_illinois_uconn.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: original-id-public-receipt
          path: b12-illinois-uconn-public.json
          if-no-files-found: warn
