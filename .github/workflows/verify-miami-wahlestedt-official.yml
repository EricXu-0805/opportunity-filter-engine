name: Read a Miami faculty research profile and Chemistry appointment
on:
  push:
    branches: [audit/b20-original-details-20261126]
    paths:
      - data/audits/miami-wahlestedt-20261126/official.py
      - .github/workflows/verify-miami-wahlestedt-official.yml
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: data/audits/miami-wahlestedt-20261126
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium
          python data/audits/miami-wahlestedt-20261126/official.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: miami-named-faculty-destinations
          path: wahlestedt-official.json
