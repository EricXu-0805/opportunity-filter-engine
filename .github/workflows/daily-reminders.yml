name: daily-reminders

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 6pm CDT / 5pm CST — evening open window
  workflow_dispatch:

# One run at a time (W14): the pipelines are scan-and-send with no server
# lock — a manual dispatch racing the schedule would double-send reminders
# or digests. Later runs queue rather than cancel (cancel could kill a
# half-done batch and delay bookkeeping).
concurrency:
  group: daily-reminders
  cancel-in-progress: false

env:
  # Surface Node 24 breakage now, on our schedule, ahead of GitHub's
  # June 16 2026 forced migration of node20 actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fire reminder cron
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "BACKEND_URL or CRON_SECRET secret not set — skipping"
            exit 0
          fi
          curl -sfSL \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/cron/reminders"

      - name: Data-quality health check
        if: env.ADMIN_TOKEN != '' && env.RESEND_API_KEY != ''
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then exit 0; fi
          BODY=$(curl -sf -H "X-Admin-Token: $ADMIN_TOKEN" \
                 "${{ secrets.BACKEND_URL }}/api/admin/health-check") || exit 0
          OK=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok', True))")
          if [ "$OK" = "True" ]; then
            echo "Health check ok — no alerts"
            exit 0
          fi
          if [ -z "$OPERATOR_EMAIL" ]; then
            echo "Alerts present but OPERATOR_EMAIL not set — printing to logs:"
            echo "$BODY"
            exit 0
          fi
          ALERTS=$(echo "$BODY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          lines = [f\"- [{a['level']}] {a['message']}\" for a in d.get('alerts', [])]
          print('\\n'.join(lines))
          ")
          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"${{ vars.RESEND_FROM_EMAIL || 'JoinALab <onboarding@resend.dev>' }}\",
              \"to\": [\"$OPERATOR_EMAIL\"],
              \"subject\": \"JoinALab: data-quality alert\",
              \"text\": \"The daily health-check found anomalies:\n\n$ALERTS\n\nDashboard: ${{ secrets.FRONTEND_URL }}/admin\"
            }" || true

      - name: New-feedback digest
        # The feedback table is INSERT-only under RLS (operators read it via
        # the admin endpoint) — without this, feedback lands invisibly.
        if: env.ADMIN_TOKEN != '' && env.RESEND_API_KEY != ''
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ] || [ -z "$OPERATOR_EMAIL" ]; then exit 0; fi
          BODY=$(curl -sf -H "X-Admin-Token: $ADMIN_TOKEN" \
                 "${{ secrets.BACKEND_URL }}/api/admin/feedback?since_hours=25&limit=50") || exit 0
          COUNT=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('count', 0))")
          if [ "$COUNT" = "0" ]; then
            echo "No new feedback in the last 25h"
            exit 0
          fi
          DIGEST=$(echo "$BODY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          lines = []
          for e in d.get('entries', []):
              path = (e.get('props') or {}).get('path') or ''
              who = e.get('email') or 'anonymous'
              lines.append(f\"- [{e.get('created_at','')[:16]}] {who} {path}\n  {e.get('message','')}\")
          print('\\n'.join(lines))
          ")
          ANALYSIS=$(echo "$BODY" | python3 -c "
          import sys, json
          a = ((json.load(sys.stdin).get('match_feedback') or {}).get('analysis')) or {}
          if a and not a.get('insufficient'):
              print(f\"Match analysis: {round((a.get('up_rate') or 0) * 100)}% up-rate over {a.get('sample_n')} votes\")
          ")
          if [ -n "$ANALYSIS" ]; then DIGEST=$(printf '%s\n\n%s' "$DIGEST" "$ANALYSIS"); fi
          export DIGEST_BODY="$DIGEST" FB_COUNT="$COUNT" APP_URL="${{ secrets.FRONTEND_URL }}" MAIL_FROM="${{ vars.RESEND_FROM_EMAIL }}"
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"from": os.environ.get("MAIL_FROM") or "JoinALab <onboarding@resend.dev>", "to": [os.environ["OPERATOR_EMAIL"]], "subject": "JoinALab: %s new user feedback" % os.environ["FB_COUNT"], "text": "New feedback in the last 25h:\n\n%s\n\nInbox: %s/admin" % (os.environ["DIGEST_BODY"], os.environ.get("APP_URL", ""))}))')
          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

      - name: New-orders digest
        # Orders a user claimed as paid sit in awaiting_confirm until the
        # operator confirms on /admin — without this, claims land invisibly.
        if: env.ADMIN_TOKEN != '' && env.RESEND_API_KEY != ''
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ] || [ -z "$OPERATOR_EMAIL" ]; then exit 0; fi
          BODY=$(curl -sf -H "X-Admin-Token: $ADMIN_TOKEN" \
                 "${{ secrets.BACKEND_URL }}/api/admin/orders?status=awaiting_confirm&since_hours=25&limit=50") || exit 0
          COUNT=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('count', 0))")
          if [ "$COUNT" = "0" ]; then
            echo "No new claimed orders in the last 25h"
            exit 0
          fi
          DIGEST=$(echo "$BODY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          lines = []
          for o in d.get('orders', []):
              amt = '%s %.2f' % ((o.get('currency') or 'usd').upper(), (o.get('amount_cents') or 0) / 100)
              lines.append(f\"- [{o.get('created_at','')[:16]}] {o.get('package','?')} {amt} · order {o.get('id','')[:8]}\")
          print('\\n'.join(lines))
          ")
          export DIGEST_BODY="$DIGEST" ORDER_COUNT="$COUNT" APP_URL="${{ secrets.FRONTEND_URL }}" MAIL_FROM="${{ vars.RESEND_FROM_EMAIL }}"
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"from": os.environ.get("MAIL_FROM") or "JoinALab <onboarding@resend.dev>", "to": [os.environ["OPERATOR_EMAIL"]], "subject": "JoinALab: %s order(s) awaiting confirmation" % os.environ["ORDER_COUNT"], "text": "Orders claimed as paid in the last 25h:\n\n%s\n\nConfirm: %s/admin" % (os.environ["DIGEST_BODY"], os.environ.get("APP_URL", ""))}))')
          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

      # Cron failures send no notification by default — the data-refresh
      # pipeline once failed 7 runs in a row before anyone noticed. Same
      # operator alert as refresh-data.yml.
      - name: Alert operator on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$OPERATOR_EMAIL" ]; then
            echo "RESEND_API_KEY / OPERATOR_EMAIL not set — cannot alert"
            exit 0
          fi
          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"${{ vars.RESEND_FROM_EMAIL || 'JoinALab <onboarding@resend.dev>' }}\",
              \"to\": [\"$OPERATOR_EMAIL\"],
              \"subject\": \"JoinALab: daily reminders cron FAILED\",
              \"text\": \"The daily reminders workflow failed.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nReminder emails, the health check, and the feedback/orders digests did not run this cycle.\"
            }" || true
