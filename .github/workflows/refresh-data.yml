name: Refresh Opportunity Data

# Daily per-school shard rotation (UTC day → shard). Every scheduled run is a
# DEEP run for its shard — each shard's weekly run IS its deep run.
#
# The day→schools table is NOT here: it lives in scripts/refresh_rotation.py
# (WEEKLY_ROTATION), whose validate_rotation() proves it covers every
# registered school exactly once. It used to be duplicated in this file and
# drifted — 25 schools were registered, collected, and shipped while sitting
# in no shard arm, so they were never re-scraped after onboarding. Rough
# weekly cost per day is 60-190 min, worst case Monday (uiuc + the monthly
# per-profile enrichment pass + Chromium).
#
# ucd runs alone, as ISOLATED_WEEKLY_SHARDS: the engine refuses it inside a
# multi-school shard (its WAF-degraded evidence must not ride a multi-school
# publication) and hosted-runner scrapes of UC Davis are Cloudflare-blocked
# anyway, so its corpus rides carry-forward. Nothing schedules that isolated
# batch yet — refresh it with a manual dispatch (schools=ucd, deep=true),
# ideally from a residential IP.
#
# First-week = the monthly per-profile enrichment (OFE_ENRICH_PROFILES) runs
# on each school's OWN shard day in the first week of the month.
on:
  schedule:
    # :07, not :00: GitHub delays scheduled runs queued at the top of the
    # hour first, and under load drops some (tests/test_workflow_schedules.py).
    - cron: '7 6 * * *'    # daily 06:07 UTC — that day's shard, deep
  workflow_dispatch:
    inputs:
      deep:
        description: 'Run deep scrape of detail pages'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      schools:
        description: 'Shard: comma-separated school slugs (e.g. uw,wisc), literal "national" for the school-less sources, empty = full refresh'
        required: false
        default: ''
        type: string
      enrich_profiles:
        description: 'Run the per-profile enrichment pass regardless of the day of month (expensive)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  # Surface Node 24 breakage now, on our schedule, ahead of GitHub's
  # June 16 2026 forced migration of node20 actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A deep shard can outlast a manual dispatch fired later the same day; two
# refreshes racing the same corpus file produce garbage merges. Queue, never
# cancel (a long scrape is too expensive to kill).
#
# The group is keyed on the EVENT, which is the fix for a defect that cost
# five scheduled runs. `cancel-in-progress: false` protects the RUNNING run,
# but GitHub still allows only one PENDING run per group — so a newly queued
# run cancels the one already waiting. With scheduled runs and manual
# dispatches sharing one group, every manual recovery dispatch silently
# cancelled the queued daily refresh. Observed 2026-09-01..09-07 (five
# `cancelled` scheduled runs, leaving rotation days 1, 5 and 6 unrefreshed and
# the corpus 14 days from a freshness cliff), and reproduced on 2026-09-10
# when one manual dispatch cancelled another.
#
# Separate groups mean a manual run can never occupy — and so never displace —
# the scheduled run's pending slot. Mutual exclusion over the corpus is kept
# by the guard step below, which makes manual work defer to production rather
# than race it.
concurrency:
  group: refresh-data-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The refresh step stops scraping at its source budget (below), but the
    # run is not done then: the PR step waits for the data PR's CI, 20-37 min
    # on most days and up to 67 when main moved and the PR was replayed
    # (2026-09-20), and on the first Monday of the month the Experts pass adds
    # up to 30. At 300 that tail did not fit, so every run that spent its
    # budget was cancelled. GitHub allows 360.
    timeout-minutes: 350
    permissions:
      contents: write
      # The overlap guard below cancels a manual run a scheduled one overtakes.
      actions: write

    steps:
      # Corpus mutual exclusion, now that scheduled and manual runs no longer
      # share a concurrency group. Two refreshes must never mutate the corpus
      # at once — the merge step closes older runs' open auto/refresh-data-*
      # PRs as superseded, so an overlap does not merely race, it destroys the
      # other run's scrape (2026-09-10: ~3h of day-6 scraping lost this way).
      #
      # Production wins. A manual recovery dispatch defers to any refresh in
      # progress; a scheduled refresh cancels a manual one and waits for it to
      # stop. Only manual runs used to check, so on 2026-10-02 a cron that fired
      # 5.5 h late ran for two hours beside a manual dispatch of the same
      # shard. The decision is overlap_decision() in scripts/refresh_rotation.py,
      # read through the API at this run's commit: the step runs BEFORE the
      # checkout, so a deferral costs seconds, not the checkout's minute.
      - name: Keep refresh runs from overlapping
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          GUARD="$RUNNER_TEMP/refresh_rotation.py"
          RUNS="$RUNNER_TEMP/refresh-runs-in-progress.json"
          # Without an answer, production proceeds and a manual run defers,
          # as overlap_decision() does when the runs cannot be listed.
          undecided() {
            if [ "$EVENT" = schedule ]; then
              echo "::warning::$1 The scheduled refresh proceeds."
              exit 0
            fi
            echo "::error::$1 This manual dispatch defers; re-dispatch it."
            exit 1
          }
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/scripts/refresh_rotation.py?ref=$SHA" > "$GUARD" \
            || undecided "Could not read scripts/refresh_rotation.py at $SHA."
          # An empty file tells the guard the listing failed.
          gh api "repos/$REPO/actions/workflows/refresh-data.yml/runs?status=in_progress&per_page=100" \
            > "$RUNS" || : > "$RUNS"
          DECISION=$(python3 "$GUARD" --overlap --event "$EVENT" --run-id "$RUN_ID" --runs "$RUNS") \
            || undecided "The overlap guard failed."
          read -r ACTION CANCEL <<< "$DECISION"
          case "$ACTION" in
            proceed) exit 0 ;;
            defer) exit 1 ;;
            cancel) ;;
            *) undecided "The overlap guard answered '$DECISION'." ;;
          esac
          for ID in $CANCEL; do
            gh api -X POST "repos/$REPO/actions/runs/$ID/cancel" > /dev/null \
              || echo "::warning::Could not ask GitHub to cancel run $ID."
          done
          # A cancelled run still runs its alert step; wait until GitHub
          # reports it completed, for up to 5 minutes.
          WAITING="$CANCEL"
          for _ in $(seq 1 30); do
            STILL=""
            for ID in $WAITING; do
              STATUS=$(gh api "repos/$REPO/actions/runs/$ID" --jq .status) || STATUS=unknown
              [ "$STATUS" = completed ] || STILL="$STILL $ID"
            done
            WAITING="$STILL"
            [ -z "$WAITING" ] && break
            sleep 10
          done
          if [ -n "$WAITING" ]; then
            echo "::warning::Run(s)$WAITING still running after 5 minutes; the scheduled refresh proceeds."
          else
            echo "Cancelled run(s) $CANCEL stopped; proceeding."
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assemble corpus work file from shards
        # git stores the corpus as per-school shards (100 MB blob limit); the
        # pipeline reads/writes the single assembled work file. assemble is a
        # no-op if a work file already exists (never clobber fresher data).
        run: python scripts/shard_corpus.py assemble

      - name: Determine shard
        id: shard
        # Delegated to scripts/refresh_rotation.py, which validate_rotation()
        # proves is an exact partition of every registered school. This table
        # used to be hardcoded here and drifted: 25 schools (every liberal-arts
        # college plus UNC) were registered, collected, and shipped, but sat in
        # no shard arm, so they were NEVER re-scraped after onboarding — their
        # faculty froze at that day's snapshot. --day also keeps ucd out of the
        # Saturday shard (it lives in ISOLATED_WEEKLY_SHARDS; the engine
        # requires it to run alone), and --schools validates an untrusted
        # dispatch value instead of interpolating it into the shell.
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHARD=$(python3 scripts/refresh_rotation.py \
              --schools "${{ inputs.schools }}" --allow-full)
          else
            SHARD=$(python3 scripts/refresh_rotation.py --day "$(date -u +%u)")
          fi
          echo "shard=$SHARD" >> $GITHUB_OUTPUT

      - name: Determine scrape mode
        id: mode
        # Scheduled shard runs are ALWAYS deep — each shard's weekly run is its
        # deep run. Manual dispatches honor the input.
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ inputs.deep }}" == "true" ]]; then
            echo "deep=true" >> $GITHUB_OUTPUT
          else
            echo "deep=false" >> $GITHUB_OUTPUT
          fi

      - name: Run data refresh
        run: |
          SHARD="${{ steps.shard.outputs.shard }}"
          ARGS=""
          if [[ "$SHARD" == "national" ]]; then
            ARGS="--national"
          elif [[ -n "$SHARD" ]]; then
            ARGS="--schools $SHARD"
          fi
          if [[ "${{ steps.mode.outputs.deep }}" == "true" ]]; then
            echo "Running DEEP refresh (shard: ${SHARD:-full})"
            # Schools that render client-side / sit behind Cloudflare need a
            # headless browser. Playwright isn't in requirements.txt (the
            # collectors lazy-import it; tests mock it) and _render_soup
            # degrades to None when it is absent — which looks exactly like an
            # unreachable directory, so a missing browser silently collects
            # nothing while the source still reports "ok". This used to be a
            # hardcoded alternation here, and 11 render-mode schools (asu,
            # brown, casewestern, colostate, drexel, indiana, lsu, rpi, uky,
            # unl, utdallas) were missing from it. They collected anyway, but
            # only by luck: the install is per-RUN, and every shard happened
            # to contain at least one listed school. One school moving days —
            # or a shard-table edit like the one above — and their departments
            # go quiet with no signal. Ask the school configs instead, so the
            # answer is right by construction rather than by coincidence.
            if [[ "$(python3 scripts/refresh_rotation.py \
                     --schools "$SHARD" --allow-full --needs-browser)" == "true" ]]; then
              pip install playwright
              python -m playwright install --with-deps chromium
            fi
            # First run of the month for this shard: enable the gated
            # per-profile enrichment pass (OFE_ENRICH_PROFILES). It follows each
            # faculty profile link to recover the email/research the directory
            # listing omits — render mode for the Cloudflare-walled schools
            # (Princeton dept subdomains, umich), plain fetch for the rest.
            # Expensive per-profile, so monthly not weekly; the richer-dedup
            # carry-forward keeps recovered fields, so already-enriched profiles
            # are skipped on later runs. Each school gets its monthly pass on
            # its own shard day in the first week of the month.
            # The dispatch input exists because the calendar gate alone made a
            # config change wait for the next first-of-month: a school whose
            # profile_enrich block gained a field could not be harvested (or
            # even checked) for up to four weeks.
            if [[ "$SHARD" != "national" ]] \
               && { [ "$(date -u +%d)" -le 07 ] \
                    || [[ "${{ inputs.enrich_profiles }}" == "true" ]]; }; then
              echo "Enabling per-profile enrichment (OFE_ENRICH_PROFILES=1)"
              export OFE_ENRICH_PROFILES=1
            fi
            # Source budget under the job's 350-minute hard timeout: 240
            # minutes, or 210 on a run that also does the Experts pass (it
            # mirrors that step's condition below). Either way the worst run
            # (budget + 2 + Experts + a 67-minute replayed PR wait + 4 of setup
            # and offline passes) ends near minute 313. Once spent, refresh_all
            # stops STARTING sources (they report
            # deferred_deadline) and the faculty_graph engine cuts the source
            # already mid-flight at the deadline (partial harvest, reported
            # partial_deadline — stale retirement skips both) so completed
            # schools still merge and publish. The 2026-08-07 run hit the hard
            # cap mid-source and published nothing, losing even the 4.5h of
            # ucsd work that had finished. The PI/contact pass after the
            # sources stops at the same deadline.
            BUDGET=240
            if { [[ -z "$SHARD" ]] || [[ ",$SHARD," == *",uiuc,"* ]]; } \
               && [ "$(date -u +%d)" -le 07 ]; then
              BUDGET=210
            fi
            python -m src.collectors.refresh_all --time-budget-minutes "$BUDGET" $ARGS
          else
            echo "Running QUICK refresh (shard: ${SHARD:-full})"
            python -m src.collectors.refresh_all --no-deep $ARGS
          fi

      - name: Monthly Illinois Experts enrichment (first week, deep uiuc runs only)
        # Pure fingerprints change slowly, so the per-person Experts scrape runs
        # ~monthly, not weekly — the keyword-richer dedup keeps its concepts when
        # the weekly broad re-scrape re-fetches the same faculty. uiuc = Monday,
        # so this fires on the first Monday of the month (same cadence as when
        # every deep run was a Monday full run). Folds into the data-refresh PR
        # below. Polite: ~1s/person, only the broad-only faculty. There were
        # 7,045 of those on 2026-10-01, 2-4 hours of fetching, so each pass
        # gets 30 minutes and takes them in a different order every month.
        if: steps.mode.outputs.deep == 'true'
        run: |
          SHARD="${{ steps.shard.outputs.shard }}"
          if [[ -n "$SHARD" && ",$SHARD," != *",uiuc,"* ]]; then
            echo "Shard '$SHARD' does not include uiuc — skipping Experts pass"
          elif [ "$(date -u +%d)" -le 07 ]; then
            echo "First week of the month — running Illinois Experts enrichment"
            python -m src.collectors.uiuc_experts --refresh --time-budget-minutes 30
          else
            echo "Not the first week of the month — skipping Experts pass"
          fi

      # Daily, corpus-wide, cheap/offline passes — deliberately NOT sharded.
      - name: Retroactive enricher pass
        run: python -m src.normalizers.enrich_processed --save

      - name: Deactivate past-deadline opportunities
        run: python -m src.normalizers.deactivate_past --save

      - name: Data-quality gate
        # Fail fast and attributably here if the fresh scrape produced dirty data,
        # rather than letting the downstream data PR's CI catch it late. The
        # tombstone invariant is the contact check the data PR failed on 09-21
        # and 09-28 (an address re-scraped onto a rejected identity).
        run: >-
          pytest -q tests/test_opportunity_data_quality.py
          "tests/test_contact_gating.py::TestTheCorpusStaysReachable::test_no_record_holds_an_address_and_a_tombstone"

      - name: Check for changes
        id: changes
        # The work file is untracked (shards are the committed form), so a
        # tracked-file diff can't answer this. Always proceed; the commit step's
        # `git diff --cached --quiet` after the split is the authoritative gate
        # and exits cleanly when the scrape produced nothing new.
        run: echo "changed=true" >> $GITHUB_OUTPUT

      - name: Open data-refresh PR and merge once required checks pass
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REFRESH_PAT secret is not set — cannot push to protected main via PR. See repo setup notes."
            exit 1
          fi

          MODE="${{ steps.mode.outputs.deep == 'true' && 'deep' || 'quick' }}"
          SHARD="${{ steps.shard.outputs.shard }}"
          TOTAL=$(python3 -c "import json; print(len(json.load(open('data/processed/opportunities.json'))))")
          EMAILS=$(python3 -c "import json; d=json.load(open('data/processed/opportunities.json')); print(sum(1 for o in d if o.get('contact_email')))")
          INACTIVE=$(python3 -c "import json; d=json.load(open('data/processed/opportunities.json')); print(sum(1 for o in d if o.get('metadata',{}).get('is_active') is False))")
          MSG="chore: auto-refresh opportunity data ($TOTAL total, $EMAILS emails, $INACTIVE inactive, $MODE mode, shard: ${SHARD:-full})"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # An earlier run's PR can linger open when main moved between its
          # checks going green and its merge (how #637 sat stuck for days,
          # blocking the pipeline). This scrape supersedes its data either way:
          # close leftovers before opening a fresh PR. Only older runs' — a
          # newer run's PR holds a newer scrape, and it used to be closed too.
          STALE=$(gh pr list --state open --json number,headRefName \
            | python3 scripts/refresh_rotation.py --superseded-prs --run-id "${{ github.run_id }}") \
            || STALE=""
          for PR in $STALE; do
            echo "closing superseded refresh PR #$PR"
            gh pr close "$PR" --comment "Superseded by a newer data-refresh run." --delete-branch || true
          done

          # A deep scrape can run hours, during which other PRs can merge to main and
          # rewrite these same data files. Branching from the run-start checkout would
          # then conflict at PR-open time — and GitHub schedules NO pull_request CI on a
          # PR it can't compute a merge commit for, so the required checks below would
          # never register and this job would hang then fail. Re-base onto the *latest*
          # main and replay the freshly scraped data on top, so the PR is conflict-free.
          cp data/processed/opportunities.json /tmp/refresh-opportunities.json
          cp data/processed/collector_status.json /tmp/refresh-collector_status.json
          # W15: the rolling history ledger is the ONLY record of a failure that
          # yesterday's snapshot no longer shows (each run rewrites the snapshot
          # and only for its own shard). It was never stashed or committed, so
          # the runner's copy died at the rebase below and the committed file
          # froze — the admin freshness chart was reading a fossil.
          if [ -f data/processed/collector_status_history.jsonl ]; then
            cp data/processed/collector_status_history.jsonl /tmp/refresh-collector_history.jsonl
          fi
          # Per-source freshness ledger (source_health.json): the ONLY record
          # of when each department last actually succeeded. The snapshot
          # above is rewritten every run and only for that run's shard, so a
          # department that has been dead for weeks is invisible in it - which
          # is how ucb_ling_faculty went 44 days unnoticed. Losing this at the
          # rebase would freeze the same fossil the history ledger used to be.
          if [ -f data/processed/source_health.json ]; then
            cp data/processed/source_health.json /tmp/refresh-source_health.json
          fi
          # Professor tracking ledger (W8): best-effort artifact — refresh_all
          # writes it unless tracking errored, so guard the copies.
          if [ -f data/processed/professor_tracking.json ]; then
            cp data/processed/professor_tracking.json /tmp/refresh-professor_tracking.json
          fi

          # Two attempts: main can move again during the ~20 min the required
          # checks run, un-merging an already-green PR. Rather than erroring out
          # with a stuck-open PR, close it and replay once onto the new main —
          # a fresh branch each time, so no force-push ever hits automation.
          for ATTEMPT in 1 2; do
            BRANCH="auto/refresh-data-${{ github.run_id }}"
            [ "$ATTEMPT" -gt 1 ] && BRANCH="$BRANCH-r$ATTEMPT"

            git fetch "$REMOTE" main
            git checkout -f -B "$BRANCH" FETCH_HEAD
            cp /tmp/refresh-opportunities.json data/processed/opportunities.json
            cp /tmp/refresh-collector_status.json data/processed/collector_status.json
            if [ -f /tmp/refresh-collector_history.jsonl ]; then
              cp /tmp/refresh-collector_history.jsonl data/processed/collector_status_history.jsonl
            fi
            if [ -f /tmp/refresh-source_health.json ]; then
              cp /tmp/refresh-source_health.json data/processed/source_health.json
            fi
            if [ -f /tmp/refresh-professor_tracking.json ]; then
              cp /tmp/refresh-professor_tracking.json data/processed/professor_tracking.json
            fi

            # Commit-time chokepoint: split the work file into minified per-school
            # shards (scripts/shard_corpus.py) — each shard sits far below GitHub's
            # 100 MB blob limit and grows independently, so onboarding more schools
            # can't outgrow a single file again. split() prunes description_raw
            # duplicates (lossless). No --prune: this run's work file is assembled
            # from its run-start checkout and omits any school onboarded to main
            # after the run began, so pruning "absent" shards would delete
            # freshly-landed schools (how #614 wiped Yale, #630 the Wave-3 six).
            #
            # --only-shards is the other half of that guarantee, and it was
            # missing. A bare split writes EVERY school in the work file, so the
            # ~100 schools this run never scraped were rewritten from run-start
            # data — silently reverting any change that landed on main during the
            # 1-5h scrape (an engine cleanup, a keyword backfill, another wave's
            # records), with no conflict and a PR title naming only this shard.
            # refresh_rotation --targets answers exactly which committed shards a
            # run is authorized to replace.
            TARGETS=$(python3 scripts/refresh_rotation.py \
              --schools "$SHARD" --allow-full --targets)
            # ...and publishable_shards answers which of those it earned. The
            # verdict is per shard file now, so a school whose source errored
            # keeps its previously committed data while its siblings publish —
            # on 2026-08-08 one broken UCSB sitemap withheld fifteen schools'
            # entire refresh. This only ever narrows the authorized set.
            TARGETS=$(python3 scripts/publishable_shards.py --authorized "$TARGETS")
            python3 scripts/shard_corpus.py split --only-shards "$TARGETS"

            # ...and the cost of that guarantee, paid here. Deadlines pass on
            # the calendar's schedule, not the rotation's: the work-file pass
            # above retires every past-deadline record, but the split persists
            # only $TARGETS, so a record in one of the ~100 other shards has its
            # retirement computed and dropped. The next CI run reassembles from
            # shards, the record is active again, and the zero-tolerance
            # data-quality gate kills the refresh — which is what
            # handshake-56d6cdae (uiuc, deadline 08-06) did to the day-4 run on
            # 2026-08-13. Retire-only and field-scoped, reading each shard from
            # the freshly fetched main, so it cannot revert a concurrent merge.
            python3 -m src.normalizers.deactivate_past --shards --save

            # Seed ledger rows for sources this run did not visit, from the
            # last_seen_at their committed records already carry. Each run
            # touches one day's shard, so without this a corpus-wide freshness
            # answer would take a full rotation to exist and would meanwhile
            # report every unvisited school as never-successful. Gap-fill
            # only: a row a real run wrote is never overwritten.
            python3 scripts/source_freshness_report.py bootstrap
            # Per-shard and per-school freshness, printed into the run log so
            # the reviewer of this PR can see which departments are degraded
            # rather than only that the totals moved.
            python3 scripts/source_freshness_report.py report || true

            # The switcher's static fallback is derived from the shards by the
            # same function the coverage API uses, so it has to be rewritten in
            # the same commit that moves them. Skipping it would ship a first
            # paint counting last week's corpus, and tests/test_school_coverage.py
            # fails the refresh PR rather than letting that land silently.
            python3 scripts/gen_school_stats.py

            git add data/processed/shards data/processed/collector_status.json
            git add frontend/src/lib/school-stats.json
            if [ -f data/processed/source_health.json ]; then
              git add data/processed/source_health.json
            fi
            if [ -f data/processed/collector_status_history.jsonl ]; then
              git add data/processed/collector_status_history.jsonl
            fi
            if [ -f data/processed/professor_tracking.json ]; then
              git add data/processed/professor_tracking.json
            fi
            if git diff --cached --quiet; then
              echo "Latest main already matches this scrape — nothing to ship."
              exit 0
            fi
            git commit -m "$MSG"
            # Push via PAT so the PR triggers CI (the default GITHUB_TOKEN does not).
            git push "$REMOTE" "$BRANCH"

            gh pr create --base main --head "$BRANCH" --title "$MSG" \
              --body "Automated ${MODE} data refresh (shard: ${SHARD:-full}). Merges automatically once Backend + Frontend checks pass."

            # Wait for the required checks to register, then watch them to
            # completion. A red check fails this step (no retry: a data/DQ
            # failure will not pass on replay) and triggers the alert below.
            for i in $(seq 1 12); do
              gh pr checks "$BRANCH" --required >/dev/null 2>&1 && break
              echo "waiting for required checks to register ($i)…"; sleep 15
            done
            gh pr checks "$BRANCH" --required --watch
            # --watch exits 0 when a required check was cancelled (gh 2.93,
            # PR #996), and the merge below would then be refused as if main
            # had moved. Only an all-pass set of required checks may merge.
            NOT_PASSED=$(gh pr checks "$BRANCH" --required --json name,bucket \
              --jq '[.[] | select(.bucket != "pass") | "\(.name)=\(.bucket)"] | join(", ")')
            if [ -n "$NOT_PASSED" ]; then
              echo "::error::Required checks did not pass: $NOT_PASSED"
              exit 1
            fi

            # Merge once green (retry briefly while GitHub recomputes mergeability).
            MERGED=""
            for i in $(seq 1 6); do
              if gh pr merge "$BRANCH" --squash --delete-branch; then MERGED=1; break; fi
              echo "merge not ready, retrying ($i)…"; sleep 10
            done
            [ -n "$MERGED" ] && exit 0

            echo "checks passed but the merge was rejected — main moved; closing and replaying"
            gh pr close "$BRANCH" --comment "Superseded: main moved between green checks and merge; replaying onto the new main." --delete-branch || true
          done
          echo "::error::Data refresh could not be merged even after a replay retry."
          exit 1

      # Dead man's switch (migration 032). The alert step below covers a run
      # that FAILS. It cannot cover a run that never happens — a disabled
      # schedule, an exhausted minutes budget, a deleted workflow — which is
      # what actually happened for 8 days in August and 18 days before that.
      # Only the absence of these check-ins can say that, and only something
      # outside GitHub can notice the absence. Placed after the merge step so
      # it means "data reached main", not "the runner booted".
      - name: Check in to the dead man's switch
        run: |
          curl -sfSL -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"refresh_data\",\"detail\":{\"run_id\":\"${{ github.run_id }}\",\"shard\":\"${{ steps.shard.outputs.shard }}\",\"mode\":\"${{ steps.mode.outputs.deep == 'true' && 'deep' || 'quick' }}\"}}" \
            "${{ secrets.BACKEND_URL }}/api/cron/heartbeat"

      # The refresh failed silently 7 runs in a row (6/25–7/02) before anyone
      # noticed — cron failures send no notification by default.
      # `failure()` alone still left one hole: hitting timeout-minutes cancels
      # the job rather than failing it, so the 5-hour timeouts on 08-01, 08-03
      # and 08-07 alerted nobody either.
      - name: Alert operator on failure
        if: failure() || cancelled()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
          SHARD: ${{ steps.shard.outputs.shard }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$OPERATOR_EMAIL" ]; then
            echo "RESEND_API_KEY / OPERATOR_EMAIL not set — cannot alert"
            exit 0
          fi
          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"${{ vars.RESEND_FROM_EMAIL || 'JoinALab <onboarding@resend.dev>' }}\",
              \"to\": [\"$OPERATOR_EMAIL\"],
              \"subject\": \"JoinALab: data refresh FAILED (shard: ${SHARD:-full})\",
              \"text\": \"The scheduled data refresh failed.\n\nShard: ${SHARD:-full}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nThe corpus has not been updated. Only this shard's schools missed their refresh; the rotation retries them next week. Repeated failures mean the pipeline is dead — check the Data-quality gate step first (that is where the last 7-run outage lived).\"
            }" || true
