name: Refresh Opportunity Data

on:
  schedule:
    - cron: '0 6 * * 1'    # Monday 6am UTC — deep scrape + enrich
    - cron: '0 6 * * 4'    # Thursday 6am UTC — quick refresh
  workflow_dispatch:
    inputs:
      deep:
        description: 'Run deep scrape of detail pages'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  # Surface Node 24 breakage now, on our schedule, ahead of GitHub's
  # June 16 2026 forced migration of node20 actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Deep Monday scrape now runs ~3.7h and grows with the corpus (160→224 min
    # over June as schools were added); the first Monday of the month also fires
    # the Illinois Experts pass on the same job. 300 gives real headroom until
    # the deep scrape moves to the VPS (the agreed "when a run nears the cap"
    # trigger — see memory ofe-github-actions-budget). Quick mode finishes <1h.
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine scrape mode
        id: mode
        run: |
          if [[ "${{ github.event.schedule }}" == "0 6 * * 1" ]] || [[ "${{ inputs.deep }}" == "true" ]]; then
            echo "deep=true" >> $GITHUB_OUTPUT
          else
            echo "deep=false" >> $GITHUB_OUTPUT
          fi

      - name: Run data refresh
        run: |
          if [[ "${{ steps.mode.outputs.deep }}" == "true" ]]; then
            echo "Running DEEP refresh (Monday or manual)"
            # The 4 ACES faculty directories render via Drupal Views AJAX, so the
            # deep run drives headless Chromium (uiuc_js_faculty). Playwright is
            # not in requirements.txt (the collector lazy-imports it and tests
            # mock it), so install it + the browser only here, on deep runs.
            pip install playwright
            python -m playwright install --with-deps chromium
            python -m src.collectors.refresh_all
          else
            echo "Running QUICK refresh (Thursday)"
            python -m src.collectors.refresh_all --no-deep
          fi

      - name: Monthly Illinois Experts enrichment (first week, deep runs only)
        # Pure fingerprints change slowly, so the per-person Experts scrape runs
        # ~monthly, not weekly — the keyword-richer dedup keeps its concepts when
        # the weekly broad re-scrape re-fetches the same faculty. Folds into the
        # data-refresh PR below. Polite: ~1s/person, only the broad-only faculty.
        if: steps.mode.outputs.deep == 'true'
        run: |
          if [ "$(date -u +%d)" -le 07 ]; then
            echo "First week of the month — running Illinois Experts enrichment"
            python -m src.collectors.uiuc_experts --refresh
          else
            echo "Not the first week of the month — skipping Experts pass"
          fi

      - name: Retroactive enricher pass
        run: python -m src.normalizers.enrich_processed --save

      - name: Deactivate past-deadline opportunities
        run: python -m src.normalizers.deactivate_past --save

      - name: Data-quality gate
        # Fail fast and attributably here if the fresh scrape produced dirty data,
        # rather than letting the downstream data PR's CI catch it late.
        run: pytest tests/test_opportunity_data_quality.py -q

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/processed/opportunities.json data/processed/collector_status.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Open data-refresh PR and merge once required checks pass
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REFRESH_PAT secret is not set — cannot push to protected main via PR. See repo setup notes."
            exit 1
          fi

          MODE="${{ steps.mode.outputs.deep == 'true' && 'deep' || 'quick' }}"
          TOTAL=$(python3 -c "import json; print(len(json.load(open('data/processed/opportunities.json'))))")
          EMAILS=$(python3 -c "import json; d=json.load(open('data/processed/opportunities.json')); print(sum(1 for o in d if o.get('contact_email')))")
          INACTIVE=$(python3 -c "import json; d=json.load(open('data/processed/opportunities.json')); print(sum(1 for o in d if o.get('metadata',{}).get('is_active') is False))")
          MSG="chore: auto-refresh opportunity data ($TOTAL total, $EMAILS emails, $INACTIVE inactive, $MODE mode)"
          BRANCH="auto/refresh-data-${{ github.run_id }}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A deep scrape runs ~2.5h, during which other PRs can merge to main and
          # rewrite these same data files. Branching from the run-start checkout would
          # then conflict at PR-open time — and GitHub schedules NO pull_request CI on a
          # PR it can't compute a merge commit for, so the required checks below would
          # never register and this job would hang then fail. Re-base onto the *latest*
          # main and replay the freshly scraped data on top, so the PR is conflict-free.
          cp data/processed/opportunities.json /tmp/refresh-opportunities.json
          cp data/processed/collector_status.json /tmp/refresh-collector_status.json
          git fetch "$REMOTE" main
          git checkout -f -B "$BRANCH" FETCH_HEAD
          cp /tmp/refresh-opportunities.json data/processed/opportunities.json
          cp /tmp/refresh-collector_status.json data/processed/collector_status.json

          git add data/processed/opportunities.json data/processed/collector_status.json
          if git diff --cached --quiet; then
            echo "Latest main already matches this scrape — nothing to ship."
            exit 0
          fi
          git commit -m "$MSG"
          # Push via PAT so the PR triggers CI (the default GITHUB_TOKEN does not).
          git push "$REMOTE" "$BRANCH"

          gh pr create --base main --head "$BRANCH" --title "$MSG" \
            --body "Automated ${MODE} data refresh. Merges automatically once Backend + Frontend checks pass."

          # Wait for the required checks to register, then watch them to completion.
          for i in $(seq 1 12); do
            gh pr checks "$BRANCH" --required >/dev/null 2>&1 && break
            echo "waiting for required checks to register ($i)…"; sleep 15
          done
          gh pr checks "$BRANCH" --required --watch

          # Merge once green (retry briefly while GitHub recomputes mergeability).
          for i in $(seq 1 6); do
            gh pr merge "$BRANCH" --squash --delete-branch && exit 0
            echo "merge not ready, retrying ($i)…"; sleep 10
          done
          echo "::error::Required checks passed but the PR could not be merged."
          exit 1
