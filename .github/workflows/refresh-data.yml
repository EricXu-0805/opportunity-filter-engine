name: Validate Opportunity Data Refresh

# Publication and automatic scheduling are deliberately paused. This manual
# workflow proves that one canonical target-only refresh can be replayed onto
# the latest main revision without touching any non-target data. A publisher
# and recurring schedule require separate authorization.
on:
  workflow_dispatch:
    inputs:
      deep:
        description: 'Run deep scrape of detail pages'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      schools:
        description: 'Required: one school, national, or one canonical scheduled shard'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# collector_status.json is global. Serialize manual validation runs so their
# compare-and-swap preimages cannot race.
concurrency:
  group: refresh-data-validation
  cancel-in-progress: false

jobs:
  validate-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read

    steps:
      - name: Check out run-start revision
        # actions/checkout v6, pinned to the reviewed commit behind the v6 tag
        # on 2026-07-31.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        # actions/setup-python v6, pinned to the reviewed commit behind the v6
        # tag on 2026-07-31.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture run-start identity
        id: base
        shell: bash
        env:
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$TRIGGER_REF" != "refs/heads/main" ]]; then
            echo "::error::Refresh validation must run from refs/heads/main."
            exit 1
          fi
          BASE_SHA="$(git rev-parse HEAD)"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          if ! git merge-base --is-ancestor "$BASE_SHA" FETCH_HEAD; then
            echo "::error::Run-start revision is not an ancestor of latest main."
            exit 1
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Assemble corpus work file from committed shards
        run: python scripts/shard_corpus.py assemble

      - name: Determine bounded refresh shard
        id: shard
        shell: bash
        env:
          REQUESTED_SCHOOLS: ${{ inputs.schools }}
        run: |
          set -euo pipefail
          SHARD="$(
            python scripts/refresh_rotation.py \
              --schools "$REQUESTED_SCHOOLS" \
              --publication-unit
          )"
          TARGETS="$(
            python scripts/refresh_rotation.py \
              --schools "$SHARD" \
              --targets
          )"
          echo "shard=$SHARD" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Determine scrape mode
        id: mode
        shell: bash
        env:
          REQUESTED_DEEP: ${{ inputs.deep }}
        run: |
          set -euo pipefail
          case "$REQUESTED_DEEP" in
            true)
              echo "deep=true" >> "$GITHUB_OUTPUT"
              echo "mode=deep" >> "$GITHUB_OUTPUT"
              ;;
            false)
              echo "deep=false" >> "$GITHUB_OUTPUT"
              echo "mode=quick" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::deep must be exactly true or false."
              exit 1
              ;;
          esac

      - name: Run bounded data refresh
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          DEEP: ${{ steps.mode.outputs.deep }}
          SHARD: ${{ steps.shard.outputs.shard }}
        run: |
          set -euo pipefail
          ARGS=(
            --base-sha "$BASE_SHA"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          if [[ "$SHARD" == "national" ]]; then
            ARGS+=(--national)
          else
            ARGS+=(--schools "$SHARD")
          fi
          if [[ "$DEEP" != "true" ]]; then
            ARGS+=(--no-deep)
          elif [[ "$SHARD" != "national" ]]; then
            pip install playwright==1.60.0
            python -m playwright install --with-deps chromium
          fi
          DAY_OF_MONTH="$((10#$(date -u +%d)))"
          if [[ "$DEEP" == "true" && "$SHARD" != "national" ]] && (( DAY_OF_MONTH <= 7 )); then
            export OFE_ENRICH_PROFILES=1
          fi
          python -m src.collectors.refresh_all "${ARGS[@]}"

      - name: Data-quality gate
        run: pytest -q -p no:cacheprovider tests/test_opportunity_data_quality.py

      - name: Split only the authorized target shards
        env:
          TARGETS: ${{ steps.shard.outputs.targets }}
        run: python scripts/shard_corpus.py split --only-shards "$TARGETS"

      - name: Build and validate target-only artifact
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/refresh-artifact
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          MODE: ${{ steps.mode.outputs.mode }}
          SHARD: ${{ steps.shard.outputs.shard }}
        run: |
          set -euo pipefail
          python scripts/refresh_artifact.py build \
            --shard "$SHARD" \
            --base-sha "$BASE_SHA" \
            --repository-root "$GITHUB_WORKSPACE" \
            --source-shards "$GITHUB_WORKSPACE/data/processed/shards" \
            --collector-status "$GITHUB_WORKSPACE/data/processed/collector_status.json" \
            --output "$ARTIFACT_ROOT" \
            --mode "$MODE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          python scripts/refresh_artifact.py validate \
            --artifact "$ARTIFACT_ROOT" \
            --expected-shard "$SHARD" \
            --expected-base-sha "$BASE_SHA" \
            --expected-mode "$MODE" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Replay artifact on latest main with compare-and-swap
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/refresh-artifact
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          LATEST_ROOT: ${{ runner.temp }}/latest-main
          MODE: ${{ steps.mode.outputs.mode }}
          SHARD: ${{ steps.shard.outputs.shard }}
          TARGETS: ${{ steps.shard.outputs.targets }}
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach "$LATEST_ROOT" FETCH_HEAD
          python "$GITHUB_WORKSPACE/scripts/refresh_artifact.py" apply \
            --artifact "$ARTIFACT_ROOT" \
            --repository-root "$LATEST_ROOT" \
            --expected-shard "$SHARD" \
            --expected-base-sha "$BASE_SHA" \
            --expected-mode "$MODE" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"

          python - "$LATEST_ROOT" "$TARGETS" <<'PY'
          import subprocess
          import sys

          root, targets_csv = sys.argv[1:]
          targets = set(targets_csv.split(","))
          allowed = {"data/processed/collector_status.json"} | {
              f"data/processed/shards/{slug}.json" for slug in targets
          }
          raw = subprocess.run(
              [
                  "git", "-C", root, "status", "--porcelain=v1", "-z",
                  "--untracked-files=all",
              ],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          changed = set()
          for entry in filter(None, raw.split(b"\0")):
              status = entry[:2]
              if status not in {b" M", b"??"} or entry[2:3] != b" ":
                  raise SystemExit(
                      f"unexpected Git status after artifact apply: {entry!r}"
                  )
              path = entry[3:].decode("utf-8")
              if path not in allowed:
                  raise SystemExit(
                      f"artifact apply changed unauthorized path: {path}"
                  )
              changed.add(path)
          print("Validated target-only latest-main diff:")
          for path in sorted(changed):
              print(f"  {path}")
          PY

      - name: Publication remains disabled
        run: |
          echo "Target-only artifact and latest-main replay validated."
          echo "No commit, push, pull request, merge, branch deletion, or email was performed."
