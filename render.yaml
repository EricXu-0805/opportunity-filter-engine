services:
  - type: web
    name: opportunity-filter-engine-api
    runtime: python
    # Standard (2GB) — startup warmup parses the full opportunity corpus into RAM
    # and fits TF-IDF. Measured 2026-07-24 at 126k records: ~1.2GB steady state
    # (~1.19GB peak single-request), so concurrent heavy requests stacking their
    # transients is what crosses 2GB (the 07-24 OOM). Budget ≈ 8KB RSS per corpus
    # record; if the corpus passes ~160k records, upgrade the plan — dieting is
    # exhausted. Durable fix remains a DB-backed corpus (then a small instance
    # suffices again).
    plan: standard
    # Deploy only after the commit's CI checks pass (Render blueprint spec,
    # verified 2026-07-25) — the default deploys every main commit immediately,
    # so a red-CI commit could reach prod before its checks finished.
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PIP_NO_CACHE_DIR
        value: "1"
      # glibc mints one malloc arena per thread by default — with the request
      # thread pool that fragments hundreds of MB of RSS at our allocation
      # pattern. Two arenas is the standard threaded-CPython setting.
      - key: MALLOC_ARENA_MAX
        value: "2"
