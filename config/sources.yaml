# Scraper Registry Configuration
# Adding a new source = add entry here + implement collector class in src/collectors/

sources:
  uiuc_our_rss:
    name: "UIUC Office of Undergraduate Research"
    type: rss
    url: "https://blogs.illinois.edu/xml/6204/rss.xml"
    schedule: daily
    enabled: true
    collector: uiuc_our_rss
    default_tags:
      source_type: uiuc_research
      on_campus: true
      international_friendly: "yes"
      location: "Champaign, IL"

  uiuc_sro:
    name: "UIUC Summer Research Opportunities Database"
    type: html_scrape
    base_url: "https://researchops.web.illinois.edu/"
    pagination:
      type: query_param
      param: page
      start: 0
      end: 11
    schedule: weekly
    enabled: true
    collector: uiuc_sro
    default_tags:
      source_type: summer_program
      opportunity_type: summer_program

  nsf_reu:
    name: "NSF REU Awards"
    type: rest_api
    base_url: "https://api.nsf.gov/services/v1/awards.json"
    schedule: weekly
    enabled: false
    collector: nsf_reu
    default_tags:
      source_type: external_reu
      international_friendly: "no"  # Default for federal; override per-program
      paid: "yes"

  usajobs:
    name: "USAJobs Federal Internships"
    type: rest_api
    base_url: "https://data.usajobs.gov/api/Search"
    requires_api_key: true
    api_key_env: "USAJOBS_API_KEY"
    schedule: weekly
    enabled: false
    collector: usajobs
    default_tags:
      source_type: federal
      international_friendly: "no"
      paid: "yes"

  # UC Berkeley campus-wide opportunity graph. The detailed per-source registry
  # (seed URLs, crawl strategy, parse rules) lives in code at
  # src/collectors/ucb_sources.py (richer than YAML allows — it carries curated
  # parse rules + fallback records). These three entries document the emit
  # buckets the collector writes into; each maps to a (school, audience) pair in
  # src/normalizers/school_audience.py.
  ucb_research_programs:
    name: "UC Berkeley Campus Research Programs"
    type: html_scrape
    base_url: "https://research.berkeley.edu/our/"
    schedule: weekly
    enabled: true
    collector: ucb_campus
    notes: >-
      Announcements, signature programs, department research pages, and
      on-campus career/RA boards. Berkeley-enrollment-gated (campus audience).
    default_tags:
      source_type: campus_program
      school: ucb
      audience: campus

  ucb_external_research:
    name: "UC Berkeley-Hosted External Research (REU / Fellowships)"
    type: html_scrape
    base_url: "https://education.lbl.gov/internships/"
    schedule: seasonal
    enabled: true
    collector: ucb_campus
    notes: >-
      External fellowships + REU-style listings hosted on Berkeley pages that
      welcome applicants from any school (national, open audience).
    default_tags:
      source_type: external_reu
      audience: open

  ucb_labs:
    name: "UC Berkeley Lab / Center Recruiting"
    type: html_scrape
    base_url: "https://bair.berkeley.edu/"
    schedule: monthly
    enabled: true
    collector: ucb_campus
    notes: >-
      "Join our lab" / research-center recruiting pages — cold-email targets
      whose cross-school openness is per-lab (unknown audience).
    default_tags:
      source_type: lab_recruiting
      school: ucb
      audience: unknown

  manual:
    name: "Manual Entries"
    type: manual
    enabled: true
    collector: null
    notes: "Entered via admin interface or CSV import"

# Rate limiting defaults
rate_limits:
  default_delay_seconds: 5
  max_retries: 3
  timeout_seconds: 30

# Scrape run logging
logging:
  log_every_run: true
  alert_on_count_drop_pct: 50
  store_raw_html: false  # Set true for debugging
